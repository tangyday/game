  <style>

    .progress { display:flex; align-items:center; gap:5px; }

    .hotspot { position:absolute; width:clamp(54px,6vw,76px); aspect-ratio:1; border:1px solid transparent; border-radius:50%; cursor:pointer; background:transparent; box-shadow:none; padding:0; transition:transform .2s,background .2s,box-shadow .2s,border-color .2s; }
    .hotspot::before { content:''; position:absolute; inset:16%; border-radius:50%; border:1px solid rgba(255,255,255,.22); box-shadow:0 0 14px rgba(255,255,255,.16); opacity:.35; animation:soft-glint 2.8s ease-in-out infinite; }

    .hotspot:hover::before, .hotspot:focus-visible::before, .hotspot.activating::before { inset:4%; border-color:rgba(255,255,255,.9); opacity:1; animation:tap-spark .42s ease-out; }
    .hotspot.done::before { border-color:rgba(255,255,255,.25); box-shadow:0 0 16px rgba(15,119,116,.2); }

    .modal-actions { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:9px; margin-top:20px; }

    .secondary { border:1px solid var(--line); background:#fff; }

    .case-result .items { margin:18px 0 8px; }

    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }

<body>
  <main class="shell">

  <dialog id="dialog"><div class="modal" id="modal"></div></dialog>

  <script>
    const chapters = [
      {
        tag:'01 · 주문 카운터', image:'images/cafe-counter.webp', alt:'고양이 카페 주문 카운터에서 첫 주문을 준비하는 나나',
        kicker:'첫 번째 임무 · 주문받기', objective:'메뉴와 주문표를 확인해 첫 주문을 정확히 접수하자!', hint:'주문표에 적힌 메뉴의 가격을 메뉴판에서 찾아 순서대로 이어 붙여 봐. 주문 확인은 손님이 말한 순서가 중요해!',
        spots:[
          {id:'menu',label:'메뉴판',icon:'📋',x:58,y:18,title:'오늘의 메뉴판',text:'메뉴판의 가격을 살펴보자.\n<b>따뜻한 라떼 5 · 딸기 케이크 4 · 발바닥 초코케이크 4 · 블루베리 머핀 4</b>\n첫 주문표와 맞춰 보면 계산대 암호를 알 수 있을 것 같다.',type:'clue'},

      {

    const initial = {chapter:0, found:[], items:[], sound:false, finished:false};

    function save(){ /* 진행 상황은 현재 페이지에서만 유지하고 새로고침 시 초기화 */ }

    const melody=[659.25,783.99,880,783.99,659.25,523.25,587.33,659.25,698.46,880,1046.5,880,783.99,659.25,587.33,null,659.25,783.99,987.77,880,783.99,659.25,587.33,523.25,587.33,698.46,880,783.99,698.46,659.25,523.25,null];

    function ensureAudio(){
      if(audioCtx)return audioCtx;

      audioCtx=new C();musicBus=audioCtx.createGain();musicBus.gain.value=.0001;musicBus.connect(audioCtx.destination);return audioCtx;
    }
    function musicNote(freq,when,duration=.24,volume=.035){
      if(!freq||!audioCtx||!musicBus)return;
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();

      o.connect(g);g.connect(musicBus);o.start(when);o.stop(when+duration+.03);
    }
    function scheduleMusic(){
      if(!state.sound||!audioCtx)return;
      while(nextNoteTime<audioCtx.currentTime+.45){
        const note=melody[musicStep%melody.length];musicNote(note,nextNoteTime,.25,.042);
        if(note)musicNote(note*2,nextNoteTime,.12,.009);
        if(musicStep%8===0)musicNote(bass[Math.floor(musicStep/8)%bass.length],nextNoteTime,.7,.018);

      }
    }

    function codePuzzle(s){
      const zeros='0'.repeat(s.digits);

    function shuffledOptions(options){
      const list=options.map((icon,index)=>({icon,index}));
      for(let i=list.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [list[i],list[j]]=[list[j],list[i]];

      if(list.length>1 && list.every((item,pos)=>item.index===pos)) list.push(list.shift());

    function confetti(){const colors=['#ffd75e','#ff8171','#73c8de','#0f7774','#fff'];for(let i=0;i<65;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=colors[i%colors.length];e.style.animationDelay=Math.random()*1.1+'s';e.style.transform=`rotate(${Math.random()*180}deg)`;document.body.appendChild(e);setTimeout(()=>e.remove(),4200);}}
    function restart(){state={...initial,found:[],items:[]};save();dialog.close();render();intro();}
    function intro(){openModal('☕','고양이 카페 첫 출근',`<div class="start-card"><div class="cat">🐱</div><p>오늘은 나나가 고양이 카페에 처음 출근하는 날!</p><p><b>주문받기 · 손님 자리 안내 · 디저트 배달</b><br>세 가지 임무를 차근차근 해결해 주세요.</p><p>두 번째 임무에는 반가운 손님 코코도 찾아온대요.</p><p><b>카페의 물건을 누르면 업무가 시작돼요.</b></p></div>`,[{label:'첫 출근 시작!',primary:true,action:()=>{dialog.close();beep(720,.12);}}]);}
    $('#hint').onclick=()=>openModal('💡','선배 직원의 힌트',`<p>${chapters[state.chapter].hint}</p>`,[{label:'알겠어!',primary:true,action:()=>dialog.close()}]);
    $('#sound').onclick=async()=>{
      if(state.sound){beep(520,.09);state.sound=false;stopMusic();}
      else{state.sound=true;await startMusic();beep(760,.12);showToast('포근한 카페 음악이 시작됐다냥 ♪');}
      save();renderHeader();
    };
    $('#reset').onclick=()=>openModal('↩️','첫 출근을 다시 시작할까?',`<p>완료한 업무와 게임 진행 상황이 모두 초기화돼요.</p>`,[{label:'계속 일할래',action:()=>dialog.close()},{label:'처음부터',primary:true,action:restart}]);
    dialog.addEventListener('click',e=>{if(e.target===dialog&&!modalLocked)dialog.close();});
    dialog.addEventListener('cancel',e=>{if(modalLocked)e.preventDefault();});
    render();
    setTimeout(intro,250);
  </script>
</body>
</html>
