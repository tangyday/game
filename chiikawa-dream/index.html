<script>

function reset(){epoch++;hide();room=0;solved=rooms.map(()=>[false,false]);visited=rooms.map(()=>[false,false]);rewards.fill(false);busy=false;ended=false;$('fade').classList.remove('cover');$('sceneImg').src=asset('scene-1');$('sceneScroll').scrollLeft=0;render();intro();}
$('restart').onclick=()=>{if(busy)return;popup('처음부터 시작할까?','<p>지금까지 찾은 단서와 퍼즐 진행이 초기화돼.</p>',[['계속 플레이하기',hide],['처음부터',reset,true]])};$('note').onclick=()=>{let html='';rooms.forEach((r,i)=>{r.clues.forEach((c,q)=>{if(visited[i][q])html+=`<div class="note-row"><b>${r.title} · ${r.objects[q*2][0]}</b><div>${c}</div></div>`})});popup('단서 노트',html||'<p>아직 기록한 단서가 없어. 그림 속 물건을 살펴보자.</p>')};$('hint').onclick=()=>{if(ended)return ending();const q=solved[room].findIndex(v=>!v);popup('다음 한 걸음',q<0?'<p>이 장소의 퍼즐을 모두 해결했어.</p>':`<p><b>${rooms[room].quizzes[q].title}</b></p><p>${rooms[room].quizzes[q].hint}</p>`)};
window.addEventListener('resize',syncAppViewport);if(window.visualViewport)window.visualViewport.addEventListener('resize',syncAppViewport);window.addEventListener('pageshow',e=>{syncAppViewport();if(e.persisted)reset()});let drag=null;const viewport=$('sceneScroll');viewport.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('button'))return;drag={x:e.clientX,left:viewport.scrollLeft,moved:false};});viewport.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>5&&!drag.moved){drag.moved=true;viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging');}if(drag.moved){viewport.scrollLeft=drag.left-dx;e.preventDefault();}});function stopDrag(){drag=null;viewport.classList.remove('dragging');}viewport.addEventListener('pointerup',stopDrag);viewport.addEventListener('pointercancel',stopDrag);viewport.addEventListener('pointerleave',()=>{if(drag&&!drag.moved)stopDrag();});if(window.visualViewport)window.visualViewport.addEventListener('scroll',syncAppViewport);syncAppViewport();render();intro();
</script></body></html>
