  <style>

    .hotspot::before { content:''; position:absolute; inset:16%; border-radius:50%; border:1px solid rgba(255,255,255,.22); box-shadow:0 0 14px rgba(255,255,255,.16); opacity:.35; animation:soft-glint 2.8s ease-in-out infinite; }

    .hotspot.done:hover, .hotspot.done:focus-visible { background:radial-gradient(circle,rgba(122,222,209,.34),rgba(15,119,116,.08) 52%,transparent 72%); box-shadow:0 0 0 8px rgba(15,119,116,.14),0 0 26px rgba(122,222,209,.5); }
    .hotspot::after { content:attr(data-label); position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); white-space:nowrap; padding:6px 10px; border-radius:9px; background:rgba(9,61,61,.92); color:#fff; font-size:.74rem; opacity:0; pointer-events:none; transition:.2s; }

    .sequence { display:flex; gap:9px; flex-wrap:wrap; margin:15px 0; }

    .sequence button.selected { border-color:var(--coral); background:#fff0ed; transform:translateY(-3px); }

    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }

          {id:'garland-clue',label:'왼쪽 가랜드',icon:'🔍',x:20,y:9,title:'반복되는 색깔',text:'가랜드를 왼쪽부터 살펴보니 색이 반복된다.\n<b>노랑 → 주황 → 파랑 → 초록</b>\n다음 장식도 같은 규칙으로 이어져야 해!',type:'clue'},
          {id:'garland',label:'오른쪽 가랜드',icon:'🎏',x:82,y:9,title:'가랜드 색상 규칙',text:'빠진 가랜드 네 장을 규칙에 맞는 순서로 걸어 보자!',type:'sequence',options:['🟡','🟠','🔵','🟢'],solution:[0,1,2,3],reward:'완성된 가랜드',success:'알록달록 가랜드가 노을빛 아래 예쁘게 이어졌다!'},
          {id:'party-note',label:'선물의 쪽지',icon:'💌',x:76,y:79,title:'코코의 준비 순서',text:'선물 상자 아래에서 그림 쪽지를 찾았다.\n<b>하늘에는 장식 → 머리에는 왕관 → 테이블에는 케이크</b>\n높은 곳부터 차례로 준비하라는 뜻이구나!',type:'clue'},
          {id:'table',label:'파티 테이블',icon:'🎂',x:50,y:52,title:'마지막 생일상 배치',text:'쪽지에서 본 순서대로 세 가지 물건을 골라 파티를 완성하자!',type:'sequence',options:['🎏','👑','🎂'],solution:[0,1,2],finish:true,success:'장식, 왕관, 케이크가 모두 제자리를 찾았다. 파티 준비 완료!'}
        ]
      }
    ];
    const initial = {chapter:0, found:[], items:[], sound:false, finished:false};
    localStorage.removeItem('coco-party-game-v2');
    let state = {...initial, found:[], items:[]};
    let selected=[];
    let modalLocked=false,hotspotBusy=false,advancePending=false;
    const $=s=>document.querySelector(s);
    const dialog=$('#dialog'), modal=$('#modal'), toast=$('#toast');

    function save(){ /* 진행 상황은 현재 페이지에서만 유지하고 새로고침 시 초기화 */ }
    let audioCtx=null,musicBus=null,musicTimer=null,nextNoteTime=0,musicStep=0;
    const melody=[659.25,783.99,880,783.99,659.25,523.25,587.33,659.25,698.46,880,1046.5,880,783.99,659.25,587.33,null,659.25,783.99,987.77,880,783.99,659.25,587.33,523.25,587.33,698.46,880,783.99,698.46,659.25,523.25,null];
    const bass=[261.63,349.23,220,392];
    function ensureAudio(){
      if(audioCtx)return audioCtx;
      const C=window.AudioContext||window.webkitAudioContext;
      if(!C)return null;
      audioCtx=new C();musicBus=audioCtx.createGain();musicBus.gain.value=.0001;musicBus.connect(audioCtx.destination);return audioCtx;
    }
    function musicNote(freq,when,duration=.24,volume=.035){
      if(!freq||!audioCtx||!musicBus)return;
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.setValueAtTime(freq,when);
      g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(volume,when+.018);g.gain.exponentialRampToValueAtTime(.0001,when+duration);
      o.connect(g);g.connect(musicBus);o.start(when);o.stop(when+duration+.03);
    }
    function scheduleMusic(){
      if(!state.sound||!audioCtx)return;
      while(nextNoteTime<audioCtx.currentTime+.45){
        const note=melody[musicStep%melody.length];musicNote(note,nextNoteTime,.25,.042);
        if(note)musicNote(note*2,nextNoteTime,.12,.009);
        if(musicStep%8===0)musicNote(bass[Math.floor(musicStep/8)%bass.length],nextNoteTime,.7,.018);
        nextNoteTime+=.29;musicStep++;
      }
    }
    async function startMusic(){
      const c=ensureAudio();if(!c)return;
      if(c.state==='suspended')await c.resume();
      musicBus.gain.cancelScheduledValues(c.currentTime);musicBus.gain.setTargetAtTime(1,c.currentTime,.08);
      if(musicTimer)return;
      nextNoteTime=c.currentTime+.05;scheduleMusic();musicTimer=setInterval(scheduleMusic,180);
    }
    function stopMusic(){
      if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
      if(audioCtx&&musicBus){musicBus.gain.cancelScheduledValues(audioCtx.currentTime);musicBus.gain.setTargetAtTime(.0001,audioCtx.currentTime,.05);}
    }
    function beep(freq=660,duration=.08){
      if(!state.sound)return;const c=ensureAudio();if(!c)return;
      const o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+duration);
    }
    function showToast(message){ toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2200); }
    function foundKey(id){ return `${state.chapter}-${id}`; }
    function addFound(id){ const key=foundKey(id);if(!state.found.includes(key)){state.found.push(key);beep(820);save();}renderHeader(); }
    function renderHeader(){
      $('#count').textContent=Math.min(state.found.length,14);
      const sound=$('#sound');sound.textContent='🎵';sound.classList.toggle('playing',state.sound);sound.setAttribute('aria-pressed',state.sound);sound.setAttribute('aria-label',state.sound?'배경음악과 효과음 끄기':'배경음악과 효과음 켜기');sound.title=state.sound?'음악 끄기':'음악 켜기';
    }
    function render(){
      const c=chapters[state.chapter];
      $('#scene').classList.add('loading');
      $('#sceneImage').src=c.image;$('#sceneImage').alt=c.alt;$('#sceneImage').onload=()=>$('#scene').classList.remove('loading');
      $('#chapterTag').textContent=c.tag;$('#kicker').textContent=c.kicker;$('#objective').textContent=c.objective;
      const hs=$('#hotspots'),ma=$('#mobileActions');hs.innerHTML='';ma.innerHTML='';
      c.spots.forEach(s=>{
        const done=state.found.includes(foundKey(s.id));
        const b=document.createElement('button');b.className='hotspot'+(done?' done':'');b.style.left=`calc(${s.x}% - 30px)`;b.style.top=`calc(${s.y}% - 30px)`;b.dataset.label=s.label;b.setAttribute('aria-label',`${s.label}${done?' · 조사 완료':''}`);b.onclick=()=>activateHotspot(b,s);hs.appendChild(b);
        const m=document.createElement('button');m.textContent=`${s.label}${done?' · 완료':''}`;m.onclick=()=>inspect(s);ma.appendChild(m);
      });
      renderHeader();
    }
    function activateHotspot(button,spot){
      if(hotspotBusy||dialog.open)return;
      hotspotBusy=true;
      button.classList.remove('activating');void button.offsetWidth;button.classList.add('activating');
      setTimeout(()=>{button.classList.remove('activating');hotspotBusy=false;if(!dialog.open)inspect(spot);},180);
    }
    function openModal(icon,title,html,actions=[],options={}){
      modalLocked=Boolean(options.locked);
      modal.innerHTML=`<div class="modal-head"><div class="modal-icon">${icon}</div><div><div class="eyebrow">코코의 조사 기록</div><h2>${title}</h2></div>${modalLocked?'':'<button class="close" aria-label="닫기">×</button>'}</div><div class="modal-body">${html}</div><div class="modal-actions"></div>`;
      const close=modal.querySelector('.close');if(close)close.onclick=()=>dialog.close();
      const area=modal.querySelector('.modal-actions');actions.forEach(a=>{const b=document.createElement('button');b.className=a.primary?'primary':'secondary';b.textContent=a.label;b.onclick=a.action;area.appendChild(b);});
      if(!dialog.open)dialog.showModal();
    }
    function inspect(s){
      if(dialog.open)return;
      beep(520);
      if(s.type==='code') return codePuzzle(s);
      if(s.id==='table'&&!state.found.includes('2-garland')){showToast('가랜드를 먼저 완성해야 한다냥!');return;}
      if(s.type==='sequence') return sequencePuzzle(s);
      addFound(s.id);
      if(s.id==='vacuum'&&!state.items.includes('장식'))state.items.push('장식');
      save();
      openModal(s.icon,s.title,`<p>${s.text.replaceAll('\n','</p><p>')}</p>`,[{label:'좋아!',primary:true,action:()=>{dialog.close();checkAdvance();render();}}]);
    }
    function kitchenPuzzlesComplete(){
      return state.chapter===1 && state.found.includes('1-box') && state.found.includes('1-cupboard');
    }
    function showKitchenComplete(){
      if(advancePending)return;
      advancePending=true;
      modalLocked=true;
      openModal('🚪','주방 임무 완료!',`<img class="transition-art" src="images/kitchen-to-rooftop.webp" alt="케이크와 장식을 싣고 옥상으로 향하는 코코와 로봇청소기"><p>케이크와 생일 초를 모두 챙겼다. 나나가 오기 전에 옥상으로 출발!</p><div class="items"><div class="item">🎂<br>케이크</div><div class="item">🕯️<br>생일 초</div></div>`,[{label:'옥상으로 가기 →',primary:true,action:()=>{state.chapter=2;advancePending=false;modalLocked=false;save();dialog.close();render();}}],{locked:true});
    }

    function codePuzzle(s){
      const zeros='0'.repeat(s.digits);
      openModal(s.icon,s.title,`<p>${s.text}</p><div class="code-row"><input id="code" inputmode="numeric" maxlength="${s.digits}" placeholder="${zeros}" aria-label="${s.digits}자리 암호"></div><p class="puzzle-feedback" id="codeFeedback" aria-live="polite"></p>`,[
        {label:'나중에',action:()=>dialog.close()},{label:'열어 보기',primary:true,action:()=>{const v=$('#code').value;if(v===s.answer){addFound(s.id);if(s.reward&&!state.items.includes(s.reward))state.items.push(s.reward);save();beep(980,.16);modal.querySelector('.modal-body').innerHTML=`<p><b>${s.success}</b></p>`;modal.querySelector('.modal-actions').innerHTML='<button class="primary" id="continue">챙기기</button>';$('#continue').onclick=()=>{dialog.close();if(kitchenPuzzlesComplete()){showKitchenComplete();return;}checkAdvance();render();};}else{beep(220,.15);const feedback=$('#codeFeedback');if(feedback)feedback.textContent='앗, 암호가 아닌 것 같다냥! 단서를 다시 살펴보자.';}}}
      ]);setTimeout(()=>$('#code')?.focus(),80);
    }
    function shuffledOptions(options){
      const list=options.map((icon,index)=>({icon,index}));
      for(let i=list.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [list[i],list[j]]=[list[j],list[i]];
      }
      // 우연히 원래 순서 그대로면 한 번 회전시켜 정답이 눈에 보이지 않게 한다.
      if(list.length>1 && list.every((item,pos)=>item.index===pos)) list.push(list.shift());
      return list;
    }

    function sequencePuzzle(s){
      selected=[];const icons=s.options;const shuffled=shuffledOptions(icons);
      openModal(s.icon,s.title,`<p>${s.text}</p><div class="sequence" id="sequence">${shuffled.map(item=>`<button data-i="${item.index}" aria-label="${item.icon}">${item.icon}</button>`).join('')}</div><p id="picked">선택: 아직 없음</p><p class="puzzle-feedback" id="sequenceFeedback" aria-live="polite"></p>`,[
        {label:'다시 고르기',action:()=>{selected=[];modal.querySelectorAll('.sequence button').forEach(b=>b.classList.remove('selected'));$('#picked').textContent='선택: 아직 없음';const feedback=$('#sequenceFeedback');if(feedback)feedback.textContent='';}},
        {label:'순서 확인',primary:true,action:()=>{if(selected.join(',')===s.solution.join(',')){addFound(s.id);if(s.reward&&!state.items.includes(s.reward))state.items.push(s.reward);save();beep(980,.16);modal.querySelector('.modal-body').innerHTML=`<p><b>${s.success}</b></p>`;modal.querySelector('.modal-actions').innerHTML=`<button class="primary" id="gotit">${s.finish?'파티 시작!':'챙기기'}</button>`;$('#gotit').onclick=()=>{if(s.finish){state.finished=true;save();return ending();}dialog.close();if(kitchenPuzzlesComplete()){showKitchenComplete();return;}checkAdvance();render();};}else{beep(220,.15);const feedback=$('#sequenceFeedback');if(feedback)feedback.textContent='순서가 다른 것 같다냥! 단서를 다시 보고 다시 골라보자.';}}}
      ]);
      modal.querySelectorAll('.sequence button').forEach(b=>b.onclick=()=>{if(selected.length>=s.solution.length||b.classList.contains('selected'))return;selected.push(+b.dataset.i);b.classList.add('selected');$('#picked').textContent='선택: '+selected.map(i=>icons[i]).join(' → ');const feedback=$('#sequenceFeedback');if(feedback)feedback.textContent='';beep(600+selected.length*70);});
    }
    function checkAdvance(){
      if(advancePending)return;
      if(state.chapter===0&&state.found.includes('0-drawer')&&state.found.includes('0-ribbon')){
        advancePending=true;
        setTimeout(()=>openModal('🚪','거실 임무 완료!',`<img class="transition-art" src="images/living-to-kitchen.webp" alt="왕관과 선물을 챙겨 주방으로 달려가는 코코"><p>왕관과 선물 포장을 모두 챙겼다. 이제 케이크가 기다리는 주방으로 가자!</p><div class="items"><div class="item">👑<br>왕관</div><div class="item">🎁<br>포장 선물</div></div>`,[{label:'주방으로 가기 →',primary:true,action:()=>{state.chapter=1;advancePending=false;modalLocked=false;save();dialog.close();render();showToast('두 번째 장소, 주방으로 이동!');}}],{locked:true}),420);
        return;
      }
      if(kitchenPuzzlesComplete()){
        showKitchenComplete();
      }
    }
    function ending(){
      confetti();
      modalLocked=false;
      openModal('🎉','깜짝 파티 대성공!',`<div class="start-card"><p>“나나야, 생일 축하해!”</p><p>나나는 왕관을 쓴 채 골골송을 불렀고, 코코는 케이크보다 더 뿌듯한 표정을 지었다.</p><p><b>오늘의 진짜 보물은 함께 준비한 즐거운 시간!</b></p><div class="items"><div class="item">🐾<br>단서 ${Math.min(state.found.length,14)}개</div><div class="item">🧩<br>퍼즐 6개</div><div class="item">💛<br>우정 +100</div></div></div>`,[{label:'다시 플레이',action:()=>restart()},{label:'엔딩 감상하기',primary:true,action:()=>showEndingArt()}]);
    }
    function showEndingArt(){
      const endingSrc='images/ending.webp';
      modalLocked=false;
      openModal('💛','코코와 나나의 생일 저녁',`<img class="ending-art" src="${endingSrc}" alt="생일파티를 마치고 함께 있는 코코와 나나" onerror="this.onerror=null;this.src='images/rooftop-party.webp';"><div class="ending-copy"><h3>HAPPY BIRTHDAY, NANA!</h3><p>몰래 준비한 파티는 대성공!<br>코코와 나나는 오래오래 오늘을 기억하기로 했어요.</p><p><b>게임을 끝까지 플레이해줘서 고마워요 🐾</b></p></div>`,[{label:'처음부터 다시',action:()=>restart()},{label:'엔딩 닫기',primary:true,action:()=>dialog.close()}]);
    }
    function confetti(){const colors=['#ffd75e','#ff8171','#73c8de','#0f7774','#fff'];for(let i=0;i<65;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=colors[i%colors.length];e.style.animationDelay=Math.random()*1.1+'s';e.style.transform=`rotate(${Math.random()*180}deg)`;document.body.appendChild(e);setTimeout(()=>e.remove(),4200);}}
    function restart(){state={...initial,found:[],items:[]};save();dialog.close();render();intro();}
    function intro(){openModal('🐱','오늘은 나나의 생일!',`<div class="start-card"><div class="cat">🎀</div><p>나나가 낮잠에서 깨기까지 딱 10분!<br>코코와 함께 집 안의 단서를 풀고 깜짝 파티를 준비해 주세요.</p><p><b>반짝이는 발바닥을 눌러 조사하면 돼요.</b></p></div>`,[{label:'작전 시작!',primary:true,action:()=>{dialog.close();beep(720,.12);}}]);}
    $('#hint').onclick=()=>openModal('💡','코코의 힌트',`<p>${chapters[state.chapter].hint}</p>`,[{label:'알겠어!',primary:true,action:()=>dialog.close()}]);
    $('#sound').onclick=async()=>{
      if(state.sound){beep(520,.09);state.sound=false;stopMusic();}
      else{state.sound=true;await startMusic();beep(760,.12);showToast('밝은 오르골 음악이 시작됐다냥 ♪');}
      save();renderHeader();
    };
    $('#reset').onclick=()=>openModal('↩️','처음부터 다시 할까?',`<p>발견한 단서와 진행 상황이 모두 초기화돼요.</p>`,[{label:'계속할래',action:()=>dialog.close()},{label:'처음부터',primary:true,action:restart}]);
    dialog.addEventListener('click',e=>{if(e.target===dialog&&!modalLocked)dialog.close();});
    dialog.addEventListener('cancel',e=>{if(modalLocked)e.preventDefault();});
    render();
    setTimeout(intro,250);
  </script>
</body>
</html>
