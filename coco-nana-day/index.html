0px}.time{font-size:12px;color:#8c7c98}.progress{display:flex;gap:7px;margin:18px 0 12px}.progress span{flex:1;height:5px;background:#dcd5e6;border-radius:8px}.progress .on{background:#9a87b5}.status{font-size:12px;color:#897c95}.objects{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.objects button{flex:1;background:#f0ebf5;color:#665478;font-size:14px;min-width:130px}.objects button.done{background:#edf3ed;color:#658064}.primary{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px}.notes{font-size:12px;color:#9a8caa;text-align:center;margin:18px 0}.end{text-align:center}.hidden{display:none!important}

<header><span class="brand">Coco & Nana</span><a href="https://nyamplay.pages.dev/">nyamplay ↗</a></header><main class="wrap"><div class="intro"><span class="kicker">A LITTLE DAY, A LITTLE ADVENTURE</span><h1>코코나나의 하루</h1><p>각자의 행복을 모아, 함께 완성하는 하루</p></div><section id="game" class="card" aria-label="게임"></section><p class="notes">그림 속 동그라미나 그림 아래 버튼을 눌러 단서를 찾아봐.</p></main>
<div id="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><button class="close" aria-label="팝업 닫기">×</button><div id="modalContent"></div></section></div>
<script>
'use strict';
const scenes=[
{title:'좋은 아침, 우리 둘',time:'08:00 · 침실',stamp:'아침 햇살',story:'커튼 사이로 햇살이 살짝 들어왔어.\n코코는 기지개를 켜고, 나나는 이불 속에서 꼼지락.\n“일어나자! 오늘도 우리만의 하루를 시작해 볼까?”',success:'커튼을 활짝 열고 알람도 껐어.\n둘이 함께 일어나니 평범한 아침도 작은 모험 같아.',items:[
{name:'창가의 커튼',pos:[18,37],clue:'커튼 끈에 달린 작은 장식이 보여.\n해 → 구름 → 달\n하루의 시작을 알려 주는 장식을 골라 커튼을 열자.',q:'아침에 어울리는 장식은 무엇일까?',choices:['달','해','구름'],answer:'해',hint:'밤이 끝나고 하늘에 떠오르는 건?'} ,
{name:'머리맡 알람',pos:[95,56],clue:'알람 뒷면에 작은 쪽지가 붙어 있어.\n“7에서 시작해서, 한 시간 더 푹 잤다!”\n알람을 끄려면 지금 시간을 숫자로 눌러야 해.',q:'지금은 몇 시일까? (숫자만)',answer:'8',hint:'7 + 1을 계산해 봐.'}]},
{title:'함께 먹는 아침',time:'09:00 · 부엌',stamp:'따뜻한 아침',story:'노릇한 빵 냄새에 둘의 귀가 쫑긋!\n코코는 접시를 놓고, 나나는 음료를 준비했어.\n식탁의 작은 수수께끼를 풀어 아침을 완성하자.',success:'따뜻한 아침 준비 끝!\n“나는 카페에 다녀올게.” “나는 집에서 하고 싶은 걸 할래!”\n둘은 서로의 하루를 응원하며 컵을 맞댔어.',items:[
{name:'토스트 접시',pos:[29,65],clue:'레시피 카드\n코코의 토스트 2조각 + 나나의 토스트 3조각\n두 접시에 놓을 빵을 모두 준비해 줘.',q:'필요한 토스트는 모두 몇 조각일까?',answer:'5',hint:'두 고양이의 몫을 더해 봐.'},
{name:'두 개의 컵',pos:[73,63],clue:'컵 받침 메모\n코코의 컵은 연보라색.\n나나는 파란색 컵을 좋아해.\n나나 앞에 컵을 놓아 주자.',q:'나나에게 놓아 줄 컵은?',choices:['파란색 컵','연보라색 컵','분홍색 컵'],answer:'파란색 컵',hint:'나나의 후드와 같은 색이야.'}]},
{title:'코코의 작은 외출',time:'11:00 · 동네 카페와 산책길',stamp:'산책의 향기',story:'코코는 연보라 가방을 메고 동네 카페로 향했어.\n시원한 라테 한 잔, 그리고 나나에게 가져갈 빵.\n카페 일을 마치면 꽃이 핀 길로 한 바퀴 걸어 보자.',success:'향긋한 라테를 마시고 꽃길도 걸었어.\n코코의 가방에는 나나와 나눠 먹을 빵이 담겨 있어.\n“오늘 저녁에 이 얘기를 들려줘야지!”',items:[
{name:'카페 주문 메모',pos:[48,62],clue:'코코가 고른 메뉴\n라테 4,000원 + 크루아상 3,000원\n지갑에는 10,000원이 있어.',q:'주문하고 남는 돈은 얼마일까? (숫자만)',answer:'3000',hint:'10,000에서 4,000과 3,000을 빼면 돼.'},
{name:'산책길 안내판',pos:[89,44],clue:'안내판에는 세 갈래 길이 적혀 있어.\n왼쪽: 공사 중\n가운데: 꽃길 공원\n오른쪽: 주차장\n코코는 꽃을 보며 산책하고 싶어.',q:'어느 길로 갈까?',choices:['오른쪽 길','왼쪽 길','가운데 길'],answer:'가운데 길',hint:'꽃길 공원으로 이어지는 길을 골라 봐.'}]},
{title:'나나의 느긋한 몰입',time:'14:00 · 집 안 작업 공간',stamp:'반짝이는 아이디어',story:'집에 남은 나나는 푹 쉬고 책을 펼쳤어.\n책을 읽다가 떠오른 아이디어로 작은 게임을 만드는 중!\n코코가 돌아오면 가장 먼저 보여 주고 싶대.',success:'책에서 얻은 아이디어가 작은 게임이 됐어!\n나나는 마지막으로 실행 버튼을 누르고 웃었어.\n“코코가 이 고양이 게임을 좋아했으면 좋겠다.”',items:[
{name:'책 속 책갈피',pos:[21,64],clue:'책갈피에 적힌 독서 기록\n오전에 12쪽, 오후에 8쪽을 읽었어.\n목표는 오늘 25쪽 읽기!',q:'목표까지 몇 쪽을 더 읽으면 될까?',answer:'5',hint:'읽은 20쪽을 목표 25쪽에서 빼 봐.'},
{name:'노트북의 게임',pos:[53,62],clue:'나나의 제작 노트\n① 고양이 캐릭터를 만든다.\n② 고양이가 걸을 길을 만든다.\n③ 직접 플레이하며 확인한다.\n지금은 캐릭터와 길을 모두 완성했어.',q:'다음에 할 일은 무엇일까?',choices:['캐릭터를 전부 지우기','직접 플레이하며 확인하기','노트북을 닫고 포기하기'],answer:'직접 플레이하며 확인하기',hint:'제작 노트의 마지막 순서를 살펴봐.'}]},
{title:'다시 만난 저녁',time:'19:00 · 우리 집 거실',stamp:'함께하는 쉼',story:'“다녀왔어!” 코코가 문을 열자 나나가 반갑게 맞았어.\n코코는 카페와 산책 얘기를, 나나는 만든 게임을 보여 줬지.\n이제 오늘의 마지막 수수께끼를 풀고 편히 쉬자.',success:'차도 준비했고, 서로의 하루도 나눴어.\n좋아하는 건 조금 달라도 함께 쉬는 이 순간은 똑같이 좋아.\n오늘의 작은 모험, 모두 성공!',items:[
{name:'소파의 담요',pos:[24,66],clue:'쿠션 뒤에 마지막 메모가 있어.\n“집에서 가장 편한 자리는\n너와 나, 둘이 나란히 앉는 자리.”',q:'오늘 하루를 마무리할 자리는?',choices:['각자 다른 방','둘이 나란히 앉은 소파','현관 앞'],answer:'둘이 나란히 앉은 소파',hint:'함께 편하게 쉴 수 있는 곳이야.'},
{name:'차와 빵 준비',pos:[76,87],clue:'저녁 간식 쪽지\n코코에게 빵 1개, 나나에게 빵 1개.\n두 고양이에게 차도 한 잔씩 준비해 줘.',q:'필요한 찻잔은 모두 몇 개일까?',answer:'2',hint:'고양이 한 마리에 한 잔씩이야.'}]}
];
const game=document.getElementById('game'),overlay=document.getElementById('overlay'),content=document.getElementById('modalContent');let stage=-1,solved=[[],[],[],[],[]],active=-1,returnFocus=null,locked=false;
function img(n){return 'images/'+n+'.webp'}function closeModal(){overlay.hidden=true;document.body.style.overflow='';active=-1;if(returnFocus&&returnFocus.isConnected)returnFocus.focus()}
function modal(html,focus){returnFocus=document.activeElement;content.innerHTML=html;overlay.hidden=false;document.body.style.overflow='hidden';overlay.querySelector('.modal').scrollTop=0;requestAnimationFrame(()=>{(focus?document.getElementById(focus):overlay.querySelector('.modal')).focus({preventScroll:true})})}
function start(){stage=0;solved=[[],[],[],[],[]];render()}
function render(){closeModal();if(stage<0){game.innerHTML='<div class="art"><img style="aspect-ratio:1200/630;object-fit:contain" src="images/og-coco-nana-day.png" alt="연보라색 옷을 입은 코코와 파란색 옷을 입은 나나의 포근한 하루"></div><div class="copy end"><h2>오늘은 어떤 하루가 될까?</h2><p>함께 눈을 뜨고 아침을 먹은 뒤,<br>코코는 동네로, 나나는 집 안의 작은 세계로.<br>다섯 장면의 수수께끼를 풀어 둘의 하루를 완성해 줘.</p><p class="status">5장면 · 10문제 · 힌트 제공 · 시간 제한 없음</p><div class="primary"><button id="start">하루 시작하기</button></div></div>';document.getElementById('start').onclick=start;return}if(stage===5){game.innerHTML='<div class="art"><img src="'+img('ending')+'" alt="달빛 아래 소파에서 함께 잠든 코코와 나나"></div><div class="copy end"><span class="stamp">다섯 조각의 행복을 모두 모았어</span><h2>평범해서 더 소중한 하루</h2><p>새로운 곳을 걸은 코코도,<br>집에서 작은 세계를 만든 나나도.<br>오늘 가장 좋았던 순간은 다시 함께한 저녁이었어.</p><p>“내일도 우리답게, 그리고 함께.”</p><div class="primary"><button id="again">다시 시작하기</button><button class="soft" id="home">게임 더 보기</button></div></div>';document.getElementById('again').onclick=start;document.getElementById('home').onclick=()=>location.href='https://nyamplay.pages.dev/';return}let s=scenes[stage];game.innerHTML='<div class="art"><img id="sceneImage" src="'+img('scene-'+(stage+1))+'" alt="'+s.title+'">'+s.items.map((p,i)=>'<button class="hotspot '+(solved[stage].includes(i)?'done':'')+'" style="left:'+p.pos[0]+'%;top:'+p.pos[1]+'%" data-item="'+i+'" aria-label="'+p.name+' 살펴보기"></button>').join('')+'</div><div class="copy"><div class="scene-head"><h2>'+s.title+'</h2><span class="time">'+s.time+'</span></div><div class="progress">'+scenes.map((_,i)=>'<span class="'+(i<=stage?'on':'')+'"></span>').join('')+'</div><span class="status">장면 '+(stage+1)+' / 5 · 찾은 행복 '+solved[stage].length+' / 2</span><p class="story">'+s.story+'</p><div class="objects">'+s.items.map((p,i)=>'<button class="'+(solved[stage].includes(i)?'done':'')+'" data-item="'+i+'">'+(solved[stage].includes(i)?'✓ ':'')+p.name+'</button>').join('')+'</div></div>';game.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>openPuzzle(+b.dataset.item));}
function openPuzzle(i){if(locked)return;active=i;const p=scenes[stage].items[i];if(solved[stage].includes(i)){modal('<h2 id="modalTitle">이미 해결한 단서야</h2><p>'+p.name+'의 수수께끼는 풀었어.<br>다른 단서도 찾아보자!</p><div class="primary"><button id="ok">돌아가기</button></div>');document.getElementById('ok').onclick=closeModal;return}modal('<h2 id="modalTitle">'+p.name+'</h2><div class="clue">'+p.clue+'</div><p class="question">'+p.q+'</p>'+(p.choices?'<div class="answers">'+p.choices.map(x=>'<button data-answer="'+x+'">'+x+'</button>').join('')+'</div>':'<form id="answerForm"><input id="answer" type="text" inputmode="numeric" pattern="[0-9, ]*" autocomplete="off" aria-label="숫자 정답" placeholder="숫자로 입력해 줘"><div class="primary"><button type="submit">정답 확인</button></div></form>')+'<div class="feedback" id="feedback" role="status" aria-live="polite"></div><button class="soft" id="hintBtn">힌트 보기</button><p class="hint hidden" id="hint">'+p.hint+'</p>',p.choices?null:'answer');content.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>check(b.dataset.answer));let f=document.getElementById('answerForm');if(f)f.onsubmit=e=>{e.preventDefault();check(document.getElementById('answer').value)};document.getElementById('hintBtn').onclick=()=>{document.getElementById('hint').classList.toggle('hidden')};}
function check(value){const i=active,p=scenes[stage].items[i];if(String(value).replace(/[ ,]/g,'').trim()!==String(p.answer).replace(/[ ,]/g,'').trim()){document.getElementById('feedback').textContent='조금만 더 생각해 보자. 단서를 다시 읽어 봐!';return}solved[stage].push(i);if(solved[stage].length===2){render();const s=scenes[stage];modal('<span class="stamp">'+s.stamp+' 획득</span><h2 id="modalTitle">'+['상쾌한 아침 시작!','아침 준비 완료!','코코의 외출 성공!','나나의 게임 완성!','오늘의 행복 완성!'][stage]+'</h2><img class="success-art" src="'+img('success-'+(stage+1))+'" alt="'+s.title+' 성공 일러스트"><p class="story">'+s.success+'</p><div class="primary"><button id="next">'+(stage===4?'엔딩 보기':'다음 장면으로')+'</button></div>');overlay.querySelector('.close').classList.add('hidden');document.getElementById('next').onclick=async()=>{if(locked)return;locked=true;closeModal();overlay.querySelector('.close').classList.remove('hidden');const pic=document.getElementById('sceneImage');if(pic)pic.style.opacity='.25';const nextImg=new Image();nextImg.src=img(stage===4?'ending':'scene-'+(stage+2));await Promise.all([Promise.race([nextImg.decode().catch(()=>{}),new Promise(r=>setTimeout(r,1500))]),new Promise(r=>setTimeout(r,230))]);stage++;render();const incoming=document.getElementById('sceneImage');if(incoming){incoming.style.opacity='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{incoming.style.opacity='1'}))}window.scrollTo({top:0,behavior:'auto'});locked=false;}}else{render();modal('<h2 id="modalTitle">단서를 풀었어!</h2><p>좋아! 이제 다른 단서 하나만 더 찾으면 돼.</p><div class="primary"><button id="continue">이어서 살펴보기</button></div>');document.getElementById('continue').onclick=closeModal}}
overlay.querySelector('.close').onclick=closeModal;document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape'&&!overlay.querySelector('.close').classList.contains('hidden'))closeModal();if(e.key==='Tab'){let el=[...overlay.querySelectorAll('button,input,[tabindex]')].filter(x=>!x.closest('.hidden')&&x.getClientRects().length);let first=el[0],last=el[el.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('pageshow',e=>{if(e.persisted){stage=-1;solved=[[],[],[],[],[]];overlay.querySelector('.close').classList.remove('hidden');locked=false;render()}});render();for(const n of ['scene-1','success-1']){let pre=new Image();pre.src=img(n)}
</script></body></html>
