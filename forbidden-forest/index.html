<script>
'use strict';
const rooms=[
{title:'금지된 숲 입구',copy:'학교의 종이 울린 뒤, 숲에서 작은 울음소리가 들려왔다. 낡은 문을 열고 빛나는 발자국을 따라가 보자.',speech:'코코 “무서운 소리가 아니라… 누가 우는 것 같아.”',token:'문지기의 허락',icon:'🌙',success:'문이 열리고, 숲의 길이 나타났다!',result:'낡은 문이 부드럽게 열리자 황금빛 발자국이 떠올랐다. 울음소리는 숲 안쪽 개울에서 들려왔다.',objects:[['문 옆 석판',16,34],['문양 잠금',85,49],['발자국 지도',42,83],['숲길 나침반',67,80]],clues:['석판을 닦자 세 문양의 숫자가 보였다.<div class="clue">달 = <b>2</b> · 별 = <b>4</b> · 잎 = <b>1</b><br>문의 문양 순서: <b>달 → 별 → 잎</b></div>','발자국이 남은 지도에는 세 갈림길이 표시되어 있다.<div class="clue">첫 갈림길: 왼쪽에 발자국<br>두 번째: 오른쪽에 발자국<br>세 번째: 왼쪽에 발자국</div>'],quizzes:[{type:'code',title:'숲의 문 열기',question:'달 → 별 → 잎. 석판의 숫자를 이어 세 자리 암호를 입력하자.',answer:'241',hint:'문 옆 석판에서 달·별·잎의 숫자를 확인해봐.'},{type:'seq',title:'울음소리 따라가기',question:'발자국 지도의 순서대로 세 번 방향을 골라보자.',options:['왼쪽','오른쪽','직진'],answer:['왼쪽','오른쪽','왼쪽'],hint:'지도의 첫 갈림길부터 세 번째까지 발자국이 있는 방향을 읽어봐.'}]},
{title:'반딧불 개울',copy:'개울 건너에서 울음소리가 더 또렷해졌다. 잠든 징검다리와 반딧불 등불을 깨워 길을 밝혀보자.',speech:'나나 “반짝이는 순서에도 규칙이 있는 것 같아.”',token:'반딧불의 빛',icon:'✨',success:'반딧불이 개울을 밝혀주었다!',result:'징검다리가 빛나고 반딧불이 길을 안내했다. 건너편 고목에서는 누군가의 오래된 기억이 속삭였다.',objects:[['돌의 숫자',27,73],['마지막 징검돌',67,83],['반딧불 기록',77,21],['등불 깨우기',89,28]],clues:['징검돌 아래에서 작은 기록을 찾았다.<div class="clue">돌에 적힌 숫자: <b>2 → 4 → 6 → ?</b><br>“한 걸음마다 같은 만큼 더해진다.”</div>','등불의 기록에는 빛이 차례대로 깜박였다고 적혀 있다.<div class="clue">첫 빛: 꿀처럼 노란 <b>금빛</b><br>두 번째: 개울 같은 <b>파랑</b><br>세 번째: 망토 같은 <b>보라</b></div>'],quizzes:[{type:'code',title:'징검다리의 규칙',question:'2, 4, 6 다음 마지막 돌에 들어갈 숫자는?',answer:'8',hint:'돌의 숫자는 한 번에 2씩 커져.'},{type:'seq',title:'반딧불 등불',question:'반딧불 기록에서 본 세 빛의 순서를 따라 눌러보자.',options:['보라','금빛','초록','파랑'],answer:['금빛','파랑','보라'],hint:'꿀의 색 → 개울의 색 → 망토의 색 순서야.'}]},
{title:'속삭이는 고목',copy:'고목의 뿌리 안쪽에서 희미한 은빛이 새어 나온다. 계절의 기억을 맞추고, 숲의 목소리에 답해보자.',speech:'코코 “나무가 우리에게 뭔가 말하려는 것 같아.”',token:'고목의 기억',icon:'🍃',success:'고목이 은빛 기억을 건넸다!',result:'은빛 잎에 작은 여우의 모습이 비쳤다. 숲의 수호자의 아기가 달빛 동굴에 갇혀 울고 있었던 것이다.',objects:[['계절의 잎',34,25],['뿌리의 문',55,50],['바람의 쪽지',86,30],['고목의 질문',63,22]],clues:['고목의 잎에는 네 계절의 기억이 새겨져 있다.<div class="clue">새싹 = <b>봄</b> · 무성한 잎 = <b>여름</b><br>붉은 잎 = <b>가을</b> · 눈꽃 = <b>겨울</b><br>“새싹에서 시작해 한 해를 따라오너라.”</div>','바람에 흔들리는 쪽지를 펼쳤다.<div class="clue">“나는 입이 없지만 네 말을 돌려준다.<br>네가 조용해지면 나도 조용해진다.<br>나의 이름은 무엇일까?”</div>'],quizzes:[{type:'seq',title:'계절의 문',question:'새싹부터 시작해서 한 해의 네 계절을 순서대로 누르자.',options:['가을','봄','겨울','여름'],answer:['봄','여름','가을','겨울'],hint:'봄이 지나면 여름, 그다음에는 가을과 겨울이 와.'},{type:'choice',title:'숲이 돌려주는 말',question:'입이 없지만 내 말을 돌려주고, 내가 조용해지면 함께 조용해지는 것은?',options:['바람','메아리','그림자','반딧불'],answer:'메아리',hint:'동굴이나 산에서 소리를 내면 같은 말이 되돌아오는 현상이야.'}]},
{title:'달빛 동굴',copy:'가시 결계 안에 작은 은빛 여우가 웅크리고 있다. 황금 방울로 결계를 잠재우고, 수호자의 인장을 복원하자.',speech:'나나 “괜찮아. 우리가 꺼내줄게.”',token:'수호자의 약속',icon:'🔔',success:'작은 울음이 안심하는 웃음으로!',result:'가시가 별가루처럼 흩어졌다. 여우는 코코와 나나에게 다가와 얼굴을 비볐다. 동굴 밖에서 엄마 수호자의 부름이 들려왔다.',objects:[['방울의 악보',15,65],['황금 방울',55,58],['수호자의 석판',79,39],['달빛 인장',83,68]],clues:['마법학교에서 가져온 황금 방울 옆에 작은 악보가 놓여 있다.<div class="clue">“밤을 열고, 길을 밝히고, 친구를 부르라.”<br><b>달 → 별 → 발바닥</b></div>','수호자의 석판을 읽었다.<div class="clue">달빛 조각 = <b>3</b><br>별빛 조각 = <b>5</b><br>숲의 잎 = <b>2</b><br>인장 순서: <b>별빛 → 숲의 잎 → 달빛</b></div>'],quizzes:[{type:'seq',title:'결계를 잠재우는 방울',question:'악보대로 세 문양을 눌러 황금 방울을 울려보자.',options:['별','발바닥','달','잎'],answer:['달','별','발바닥'],hint:'달로 밤을 열고, 별로 길을 밝히고, 발바닥으로 친구를 불러.'},{type:'code',title:'수호자의 인장 복원',question:'별빛 → 숲의 잎 → 달빛. 조각의 숫자를 이어 세 자리 암호를 입력하자.',answer:'523',hint:'석판에서 별빛은 5, 숲의 잎은 2, 달빛은 3이야.'}]}
];
let room=0,solved=rooms.map(()=>[false,false]),visited=rooms.map(()=>[false,false]),rewards=[false,false,false,false],busy=false,ended=false,previousFocus=null,scrollY=0;

const cache=new Map();function preload(src){if(cache.has(src))return cache.get(src);const p=new Promise(resolve=>{const i=new Image();i.onload=()=>{if(i.decode)i.decode().catch(()=>{}).then(()=>resolve(i));else resolve(i)};i.onerror=()=>resolve(null);i.src=src});cache.set(src,p);return p;}

function button(label,fn,primary=false){const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.addEventListener('click',fn);return b;}
function syncAppViewport(){const h=Math.round((window.visualViewport&&window.visualViewport.height)||window.innerHeight||document.documentElement.clientHeight||800);document.documentElement.style.setProperty('--app-vh',h+'px');}
function popup(title,html,actions=[['확인',hide,true]],mandatory=false){syncAppViewport();previousFocus=document.activeElement;$('popupTitle').textContent=title;$('popupBody').innerHTML=html;$('popupBody').scrollTop=0;$('popupActions').replaceChildren();actions.forEach(([label,fn,p])=>$('popupActions').append(button(label,fn,p)));$('close').hidden=mandatory;$('overlay').classList.add('open');$('overlay').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';requestAnimationFrame(()=>{const el=$('popupBody').querySelector('input')||$('popupActions').querySelector('button');if(el){try{el.focus({preventScroll:true})}catch(e){}}});}
function hide(){if(!$('overlay').classList.contains('open'))return;$('overlay').classList.remove('open');$('overlay').setAttribute('aria-hidden','true');document.body.style.overflow='';if(previousFocus&&previousFocus.isConnected){try{previousFocus.focus({preventScroll:true})}catch(e){previousFocus.focus()}}}
$('close').onclick=hide;$('overlay').onclick=e=>{if(e.target===$('overlay')&&!$('close').hidden)hide();};document.addEventListener('keydown',e=>{if(!$('overlay').classList.contains('open'))return;if(e.key==='Escape'&&!$('close').hidden)hide();if(e.key==='Tab'){const list=[...$('overlay').querySelectorAll('button,input')].filter(x=>!x.hidden&&!x.disabled);if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
function render(){const r=rooms[room];$('progress').innerHTML=rooms.map((x,i)=>`<div class="step ${i===room?'active':rewards[i]?'done':''}">${String(i+1).padStart(2,'0')} · ${['숲 입구','개울','고목','동굴'][i]}</div>`).join('');$('roomTitle').textContent=r.title;$('roomCopy').textContent=r.copy;$('speech').textContent=r.speech;$('location').textContent=String(room+1).padStart(2,'0')+' · '+r.title;$('sceneImg').alt=r.title+'의 코코와 나나';$('tools').replaceChildren();$('spots').replaceChildren();r.objects.forEach(([name,x,y],i)=>{const done=i%2===1&&solved[room][Math.floor(i/2)],b=button(name+(done?' ✓':''),()=>inspect(i));$('tools').append(b);const s=button('',()=>inspect(i));s.className='hotspot'+(done?' solved':'');s.style.left=x+'%';s.style.top=y+'%';s.setAttribute('aria-label',name);$('spots').append(s)});$('tokens').innerHTML=rooms.map((x,i)=>`<div class="token ${rewards[i]?'got':''}"><b>${x.icon}</b>${rewards[i]?x.token:'아직 발견 전'}</div>`).join('');$('count').textContent=rewards.filter(Boolean).length+' / 4';}
function inspect(i){if(busy)return;const q=Math.floor(i/2);if(i%2===0){visited[room][q]=true;popup(rooms[room].objects[i][0],'<p>'+rooms[room].clues[q]+'</p>');}else quiz(q);}
function quiz(q){const x=rooms[room].quizzes[q];if(solved[room][q])return popup(x.title,'<p>이미 해결한 퍼즐이야. 다른 단서도 살펴보자.</p>');let selected=[];popup(x.title,`<p>${x.question}</p>${x.type==='code'?'<input id="answer" class="code" aria-label="암호 입력" inputmode="numeric" autocomplete="off" maxlength="3"><p class="feedback" id="feedback" aria-live="polite"></p>':'<div id="selection" class="sequence">'+(x.type==='seq'?'순서대로 골라주세요':'알맞은 답을 골라주세요')+'</div><div id="choices" class="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p>'}`,[['단서 보기',()=>{visited[room][q]=true;popup(rooms[room].objects[q*2][0],'<p>'+rooms[room].clues[q]+'</p>',[['퍼즐로 돌아가기',()=>quiz(q),true]])}],['닫기',hide]]);const wrong=()=>{$('feedback').textContent='아직 맞지 않아. 단서를 다시 살펴볼까?';};if(x.type==='code'){const submit=button('암호 확인',()=>{if($('answer').value.trim()===x.answer)complete(q);else wrong()},true);$('popupActions').append(submit);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')submit.click()});}else{x.options.forEach(opt=>$('choices').append(button(opt,()=>{if(x.type==='choice'){if(opt===x.answer)complete(q);else wrong();return}selected.push(opt);$('selection').textContent=selected.join(' → ');$('feedback').textContent='';if(selected.length===x.answer.length){if(selected.every((v,i)=>v===x.answer[i]))complete(q);else{wrong();selected=[];$('selection').textContent='순서를 다시 골라주세요';}}})));if(x.type==='seq')$('popupActions').append(button('선택 지우기',()=>{selected=[];$('selection').textContent='순서대로 골라주세요';$('feedback').textContent=''}));}}
async function complete(q){if(solved[room][q])return;solved[room][q]=true;render();if(!solved[room].every(Boolean)){popup('첫 번째 퍼즐 해결!','<p>숲의 마법이 조금 풀렸어. 이 장소의 남은 퍼즐도 해결해보자.</p>',[['계속 탐색하기',hide,true]],true);return}busy=true;await preload(asset('success-'+(room+1)));rewards[room]=true;busy=false;render();popup(rooms[room].success,`<img src="${asset('success-'+(room+1))}" alt="${rooms[room].success}"><p>${rooms[room].result}</p><div class="clue">${rooms[room].icon} <b>${rooms[room].token}</b> 획득</div>`,[[room===3?'이야기의 결말 보기':'다음 장소로 →',()=>{hide();if(room===3)ending();else go(room+1)},true]],true);}
async function go(next){if(busy)return;busy=true;const imageReady=preload(asset('scene-'+(next+1)));$('fade').classList.add('cover');await new Promise(r=>setTimeout(r,250));await imageReady;room=next;$('sceneImg').src=asset('scene-'+(room+1));$('sceneScroll').scrollLeft=0;render();requestAnimationFrame(()=>requestAnimationFrame(()=>{$('fade').classList.remove('cover');busy=false;}));}
async function ending(){ended=true;await preload(asset('ending'));popup('숲이 다시 노래하기 시작했다',`<img src="${asset('ending')}" alt="은빛 여우 가족과 코코나나의 평화로운 재회"><p class="ending-label">THE END · 숲의 작은 친구들</p><p>동굴을 나오자 은빛 수호자가 달려왔다. 작은 여우는 엄마의 품으로 뛰어들었다.</p><div class="clue">“무서운 울음이 아니었어. 집에 가고 싶다는 말이었구나.”<br><b>— 나나</b></div><p>수호자는 고맙다는 듯 두 고양이의 망토에 은빛 잎 배지를 달아주었다. 금지된 숲은 이제 코코와 나나를 기억할 것이다.</p><p>코코 “다음엔 울지 말고 우리를 불러줘!”<br>나나 “그리고… 학교에 늦기 전에 돌아가자.”</p><p>아침 종이 울렸다. 두 고양이의 두 번째 수업은, 작은 목소리에 귀 기울이는 마법이었다.</p>`,[['결말 닫기',hide],['다시 플레이하기',reset,true]],true);}
function intro(){popup('두 번째 수업, 숲으로',`<img class="intro-art" src="${asset('scene-1')}" alt="보라색 망토를 입은 코코와 나나"><p>별빛 마법서를 되찾은 다음 날 밤.<br>금지된 숲에서 낯선 울음소리가 들려왔어.</p><p>코코와 나나는 황금 방울을 챙겨 숲으로 향했지. 그곳에는 도움이 필요한 작은 친구가 기다리고 있었어.</p><div class="clue">그림의 연한 동그라미나 아래 탐색 버튼을 눌러 단서를 찾아봐.<br><b>각 장소의 두 퍼즐을 풀면 다음 장소로 갈 수 있어.</b></div>`,[['숲으로 들어가기',hide,true]],true);}
function reset(){hide();room=0;solved=rooms.map(()=>[false,false]);visited=rooms.map(()=>[false,false]);rewards.fill(false);busy=false;ended=false;$('fade').classList.remove('cover');$('sceneImg').src=asset('scene-1');$('sceneScroll').scrollLeft=0;render();intro();}
$('restart').onclick=()=>{if(busy)return;popup('처음부터 시작할까?','<p>지금까지 찾은 단서와 퍼즐 진행이 초기화돼.</p>',[['계속 플레이하기',hide],['처음부터',reset,true]])};$('note').onclick=()=>{let html='';rooms.forEach((r,i)=>{r.clues.forEach((c,q)=>{if(visited[i][q])html+=`<div class="note-row"><b>${r.title} · ${r.objects[q*2][0]}</b><div>${c}</div></div>`})});popup('단서 노트',html||'<p>아직 기록한 단서가 없어. 그림 속 물건을 살펴보자.</p>')};$('hint').onclick=()=>{if(ended)return ending();const q=solved[room].findIndex(v=>!v);popup('다음 한 걸음',q<0?'<p>이 장소의 퍼즐을 모두 해결했어.</p>':`<p><b>${rooms[room].quizzes[q].title}</b></p><p>${rooms[room].quizzes[q].hint}</p>`)};
window.addEventListener('resize',syncAppViewport);if(window.visualViewport)window.visualViewport.addEventListener('resize',syncAppViewport);window.addEventListener('pageshow',e=>{syncAppViewport();if(e.persisted)reset()});syncAppViewport();render();intro();
</script></body></html>
