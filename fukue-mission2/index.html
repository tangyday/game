'use strict';

73], ["ポストカード箱", 88, 68], ["観察メモ", 14, 43], ["小さな巣箱", 90, 43]], "clues": ["<div class=\"clue\">ポストカードに描かれた花の色：<br><b>白 → ピンク → 黄</b><br>色ボタンも、この順番で選ぼう。</div>", "<div class=\"clue\">観察メモ：<br><b>巣箱の屋根には星が2つ、<br>側面には星が3つ描かれている。</b><br>暗証番号は<b>2か所の星を合わせた数</b>だよ。</div>"], "quizzes": [{"type": "seq", "title": "ポストカード箱", "question": "ポストカードの花の色を、順番に選んでね。", "options": ["黄", "青", "白", "ピンク"], "answer": ["白", "ピンク", "黄"], "hint": "白の次はピンク、最後は黄だよ。"}, {"type": "code", "title": "小さな巣箱", "question": "屋根の星2つと側面の星3つを合わせると？", "answer": "5", "hint": "2 + 3だよ。"}]}, {"title": "石田城", "short": "石田城", "copy": "古い城門とお堀に沿って歩こう。石垣の地図と水面に映る景色から、城門のスタンプの手がかりを探してね。", "speech": "ナナ「城門をくぐると、時間がゆっくり流れるみたい。」", "token": "城門のスタンプ", "icon": "🏯", "success": "石田城のミッション成功！", "result": "城門のスタンプ箱が開いたよ。石垣とお堀に沿ってゆっくり歩き、福江島の昔ながらの景色を心に刻んだ。", "objects": [["石垣の地図", 13, 49], ["城門のスタンプ箱", 86, 80], ["お堀の記録", 91, 67], ["石垣の数字", 13, 63]], "clues": ["<div class=\"clue\">石垣の地図に書かれた道順：<br><b>城門 → 木陰 → お堀</b><br>スタンプ箱の絵も、この順番で選ぼう。</div>", "<div class=\"clue\">石垣に残された数字：<br><b>3 → 6 → 9 → ?</b><br>同じ数ずつ増えているよ。</div>"], "quizzes": [{"type": "seq", "title": "城門のスタンプ箱", "question": "地図に書かれた散策ルートの順に選んでね。", "options": ["お堀", "城門", "木陰"], "answer": ["城門", "木陰", "お堀"], "hint": "最初は城門、次は木陰、最後はお堀だよ。"}, {"type": "code", "title": "石垣の数字", "question": "3、6、9の次に入る数字は？", "answer": "12", "hint": "3ずつ増えているよ。"}]}, {"title": "長崎ちゃんぽんのお店", "short": "ちゃんぽん", "copy": "たくさん歩いたから、おいしいちゃんぽんを食べに来たよ！注文票と食材カードを見比べて、温かい一杯を完成させよう。", "speech": "ココ「スープのいい香り！一緒に食べようね。」", "token": "ちゃんぽんのスタンプ", "icon": "🍜", "success": "ちゃんぽんのお店のミッション成功！", "result": "注文の確認が終わって、温かいちゃんぽんが運ばれてきたよ。野菜と麺がたっぷりの一杯を味わい、おなかいっぱいの思い出をスタンプにした。", "objects": [["食材カード", 81, 83], ["厨房の注文ボード", 96, 65], ["注文票", 17, 80], ["お箸のセット", 59, 60]], "clues": ["<div class=\"clue\">今日の食材カード：<br><b>キャベツ = 2・もやし = 4・かまぼこ = 1</b><br>厨房の暗号の順番：<b>もやし → かまぼこ → キャベツ</b></div>", "<div class=\"clue\">ココとナナの注文：<br><b>ちゃんぽん2杯</b><br>1杯につき<b>お箸が1膳</b>必要だよ。</div>"], "quizzes": [{"type": "code", "title": "厨房の注文ボード let room=0,solved=rooms.map(()=>[false,false]),visited=rooms.map(()=>[false,false]),rewards=rooms.map(()=>false),busy=false,ended=false,previousFocus=null,scrollY=0,epoch=0;
const $=id=>document.getElementById(id),asset=n=>'images/'+n+'.webp';
const cache=new Map();function preload(src){if(cache.has(src))return cache.get(src);const p=new Promise(resolve=>{const i=new Image();i.onload=()=>{if(i.decode)i.decode().catch(()=>{}).then(()=>resolve(i));else resolve(i)};i.onerror=()=>resolve(null);i.src=src});cache.set(src,p);return p;}
[...rooms.map((_,i)=>'scene-'+(i+1)),...rooms.map((_,i)=>'success-'+(i+1)),'ending'].forEach(n=>preload(asset(n)));
function button(label,fn,primary=false){const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.addEventListener('click',fn);return b;}
function syncAppViewport(){const h=Math.round((window.visualViewport&&window.visualViewport.height)||window.innerHeight||document.documentElement.clientHeight||800);document.documentElement.style.setProperty('--app-vh',h+'px');}
function popup(title,html,actions=[['OK',hide,true]],mandatory=false){syncAppViewport();previousFocus=document.activeElement;$('popupTitle').textContent=title;$('popupBody').innerHTML=html;$('popupBody').scrollTop=0;$('popupActions').replaceChildren();actions.forEach(([label,fn,p])=>$('popupActions').append(button(label,fn,p)));$('close').hidden=mandatory;$('overlay').classList.add('open');$('overlay').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.querySelector('main').inert=true;requestAnimationFrame(()=>{const el=$('popupBody').querySelector('input')||$('popupActions').querySelector('button');if(el){try{el.focus({preventScroll:true})}catch(e){}}});}
function hide(){if(!$('overlay').classList.contains('open'))return;$('overlay').classList.remove('open');$('overlay').setAttribute('aria-hidden','true');document.body.style.overflow='';document.querySelector('main').inert=false;if(previousFocus&&previousFocus.isConnected){try{previousFocus.focus({preventScroll:true})}catch(e){previousFocus.focus()}}}
$('close').onclick=hide;$('overlay').onclick=e=>{if(e.target===$('overlay')&&!$('close').hidden)hide();};document.addEventListener('keydown',e=>{if(!$('overlay').classList.contains('open'))return;if(e.key==='Escape'&&!$('close').hidden)hide();if(e.key==='Tab'){const list=[...$('overlay').querySelectorAll('button,input')].filter(x=>!x.hidden&&!x.disabled);if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
function render(){const r=rooms[room];$('progress').innerHTML=rooms.map((x,i)=>`<div class="step ${i===room?'active':rewards[i]?'done':''}">${String(i+1).padStart(2,'0')} · ${x.short}</div>`).join('');$('roomTitle').textContent=r.title;$('roomCopy').textContent=r.copy;$('speech').textContent=r.speech;$('location').textContent=String(room+1).padStart(2,'0')+' · '+r.title;$('sceneImg').alt=r.title+'のココとナナ';$('tools').replaceChildren();$('spots').replaceChildren();r.objects.forEach(([name,x,y],i)=>{const done=i%2===1&&solved[room][Math.floor(i/2)],b=button(name+(done?' ✓':''),()=>inspect(i));$('tools').append(b);const s=button('',()=>inspect(i));s.className='hotspot'+(done?' solved':'');s.style.left=x+'%';s.style.top=y+'%';s.setAttribute('aria-label',name);$('spots').append(s)});$('tokens').innerHTML=rooms.map((x,i)=>`<div class="token ${rewards[i]?'got':''}"><b>${x.icon}</b>${rewards[i]?x.token:'まだ訪問前'}</div>`).join('');$('count').textContent=rewards.filter(Boolean).length+' / '+rooms.length;}
function inspect(i){if(busy)return;const q=Math.floor(i/2);if(i%2===0){visited[room][q]=true;popup(rooms[room].objects[i][0],'<p>'+rooms[room].clues[q]+'</p>');}else quiz(q);}
function quiz(q){const x=rooms[room].quizzes[q];if(solved[room][q])return popup(x.title,'<p>このパズルはもう解けたよ。ほかの手がかりも探してみよう。</p>');let selected=[];popup(x.title,`<p>${x.question}</p>${x.type==='code'?'<input id="answer" class="code" aria-label="暗号を入力" inputmode="numeric" autocomplete="off" maxlength="3"><p class="feedback" id="feedback" aria-live="polite"></p>':'<div id="selection" class="sequence">'+(x.type==='seq'?'順番に選んでね':'正しい答えを選んでね')+'</div><div id="choices" class="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p>'}`,[['手がかりを見る',()=>{visited[room][q]=true;popup(rooms[room].objects[q*2][0],'<p>'+rooms[room].clues[q]+'</p>',[['パズルに戻る',()=>quiz(q),true]])}],['閉じる',hide]]);const wrong=()=>{$('feedback').textContent='まだ違うみたい。手がかりをもう一度見てみよう。';};if(x.type==='code'){const submit=button('暗号を確認',()=>{if($('answer').value.trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))===x.answer)complete(q);else wrong()},true);$('popupActions').append(submit);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit.click()}});}else{x.options.forEach(opt=>$('choices').append(button(opt,()=>{if(x.type==='choice'){if(opt===x.answer)complete(q);else wrong();return}selected.push(opt);$('selection').textContent=selected.join(' → ');$('feedback').textContent='';if(selected.length===x.answer.length){if(selected.every((v,i)=>v===x.answer[i]))complete(q);else{wrong();selected=[];$('selection').textContent='順番を選び直してね';}}})));if(x.type==='seq')$('popupActions').append(button('選択をクリア',()=>{selected=[];$('selection').textContent='順番に選んでね';$('feedback').textContent=''}));}}
async function complete(q){const run=epoch;if(solved[room][q])return;solved[room][q]=true;render();if(!solved[room].every(Boolean)){popup('1つ目のパズルをクリア！','<p>スタンプまであと一歩！この場所のもう1つのパズルも解いてみよう。</p>',[['探索を続ける',hide,true]],true);return}busy=true;await preload(asset('success-'+(room+1)));if(run!==epoch)return;rewards[room]=true;busy=false;render();popup(rooms[room].success,`<img src="${asset('success-'+(room+1))}" alt="${rooms[room].success}"><p>${rooms[room].result}</p><div class="clue">${rooms[room].icon} <b>${rooms[room].token}</b> をゲット！</div>`,[[room===rooms.length-1?'旅の結末を見る':'次の場所へ →',()=>{hide();if(room===rooms.length-1)ending();else go(room+1)},true]],true);}
async function go(next){const run=epoch;if(busy)return;busy=true;const imageReady=preload(asset('scene-'+(next+1)));$('fade').classList.add('cover');await new Promise(r=>setTimeout(r,250));await imageReady;if(run!==epoch)return;room=next;$('sceneImg').src=asset('scene-'+(room+1));$('sceneScroll').scrollLeft=0;render();requestAnimationFrame(()=>requestAnimationFrame(()=>{$('fade').classList.remove('cover');busy=false;}));}
async function ending(){const run=epoch;ended=true;await preload(asset('ending'));if(run!==epoch)return;popup('福江島で過ごした1日',`<img src="${asset('ending')}" alt="福江島の海辺でココ、ナナ、つばきねこが一緒に撮った記念写真"><p class="ending-label">THE END · 福江島めぐりミッション</p><p>風に舞う凧、澄んだ海辺、真っ白な教会と古い城門。<br>おいしいちゃんぽんと緑のつたのカフェまで、6か所の思い出が集まったよ。</p><p>ココとナナは完成したスタンプ帳を広げて、福江島の友だち、つばきねこと一緒に記念写真を撮った。</p><div class="clue">ココ「今日の風と海、ずっと覚えていたいね。」<br>ナナ「また来ようね。ふたりで一緒に。」</div><p>小さな島で過ごした、心温まる1日。<br>次の旅で、また会おうね！</p>`,[['結末を閉じる',hide],['もう一度遊ぶ',reset,true]],true);}
function intro(){popup('福江島めぐりミッション',`<img class="intro-art" src="${asset('scene-1')}" alt="鬼岳のココとナナ"><p>ココとナナの福江島の旅が始まったよ！<br>スタンプ帳の6ページを、旅の思い出でいっぱいにしよう！</p><p>鬼岳 → 海辺の公園 → 水ノ浦教会 → 石田城 → ちゃんぽんのお店 → カフェ。<br>それぞれの場所で手がかりを見つけて、スタンプを集めよう。</p><div class="clue">絵の中の丸いマークか、下の探索ボタンを押してみてね。<br><b>各場面のパズルを2つとも解くと、クリアイラストと次の場所が開くよ。</b></div>`,[['旅を始める',hide,true]],true);}
function reset(){epoch++;hide();room=0;solved=rooms.map(()=>[false,false]);visited=rooms.map(()=>[false,false]);rewards.fill(false);busy=false;ended=false;$('fade').classList.remove('cover');$('sceneImg').src=asset('scene-1');$('sceneScroll').scrollLeft=0;render();intro();}
$('restart').onclick=()=>{if(busy)return;popup('最初から始める？','<p>見つけた手がかりとパズルの進み具合がリセットされるよ。</p>',[['このまま続ける',hide],['最初から',reset,true]])};$('note').onclick=()=>{if(busy)return;let html='';rooms.forEach((r,i)=>{r.clues.forEach((c,q)=>{if(visited[i][q])html+=`<div class="note-row"><b>${r.title} · ${r.objects[q*2][0]}</b><div>${c}</div></div>`})});popup('手がかりノート',html||'<p>まだ手がかりの記録がないよ。絵の中のものを調べてみよう。</p>')};$('hint').onclick=()=>{if(busy)return;if(ended)return ending();const q=solved[room].findIndex(v=>!v);popup('次の一歩',q<0?'<p>この場所のパズルは全部解けたよ。</p>':`<p><b>${rooms[room].quizzes[q].title}</b></p><p>${rooms[room].quizzes[q].hint}</p>`)};
