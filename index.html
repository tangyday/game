  <link rel="preload" as="image" href="images/success-kitchen.webp">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ffd75e'/%3E%3Ccircle cx='24' cy='27' r='7' fill='%230f7774'/%3E%3Ccircle cx='40' cy='27' r='7' fill='%230f7774'/%3E%3Ccircle cx='18' cy='39' r='7' fill='%230f7774'/%3E%3Ccircle cx='46' cy='39' r='7' fill='%230f7774'/%3E%3Cellipse cx='32' cy='45' rx='13' ry='11' fill='%230f7774'/%3E%3C/svg%3E">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');
    :root { --ink:#3f554f; --teal:#5d927d; --deep:#3f725f; --yellow:#ffd986; --cream:#fffaf1; --coral:#e98678; --sky:#89c9d7; --line:rgba(63,85,79,.16); }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body { font-family:'Noto Sans KR',system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 10% 0%,#fff0c8 0,transparent 28%),linear-gradient(145deg,#fffdf7,#eaf7ef); }
    button, input { font:inherit; }
    button { color:inherit; }
    .shell { width:min(1240px,100%); min-height:100vh; margin:auto; padding:18px clamp(12px,3vw,36px) 28px; }
    .topbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    .brand { margin-right:auto; }
    .eyebrow { font-size:.75rem; font-weight:700; letter-spacing:.13em; color:var(--teal); }
    h1 { margin:1px 0 0; font-family:'Gaegu',cursive; font-size:clamp(1.75rem,4vw,2.7rem); line-height:1; }
    .pill { border:1px solid var(--line); background:rgba(255,255,255,.78); border-radius:999px; min-height:44px; padding:0 14px; display:inline-flex; align-items:center; gap:7px; font-weight:700; box-shadow:0 6px 18px rgba(20,91,91,.08); }
    button.pill { cursor:pointer; }
    button.pill:hover { background:#fff; transform:translateY(-1px); }
    #sound { width:44px; min-width:44px; padding:0; justify-content:center; font-size:1.1rem; }
    button.pill.playing { color:#075454; background:#fff8d5; border-color:#e9c852; animation:bounce-note .8s ease-in-out infinite alternate; }
    @keyframes bounce-note { to { transform:translateY(-2px) rotate(5deg); } }
    .progress { display:flex; align-items:center; gap:5px; }
    .paw { width:13px; height:13px; border:2px solid var(--teal); border-radius:50% 50% 45% 45%; opacity:.28; transition:.25s; }
    .paw.found { background:var(--yellow); border-color:#ca9621; opacity:1; transform:scale(1.08); }
    .game-card { overflow:hidden; border:1px solid rgba(255,255,255,.9); border-radius:26px; background:#fff; box-shadow:0 24px 70px rgba(13,86,84,.2); }
    .scene-scroll { position:relative; overflow:hidden; }
    .scene { position:relative; aspect-ratio:16/9; overflow:hidden; background:#dff1ef; }
    .scene img { display:block; width:100%; height:100%; object-fit:cover; transition:opacity .35s,transform .7s; }
    .pan-guide { display:none; }
    .scene.loading img { opacity:.25; transform:scale(1.015); }
    .chapter-tag { position:absolute; left:18px; bottom:18px; top:auto; padding:8px 13px; border-radius:999px; background:rgba(255,255,255,.9); font-size:.8rem; font-weight:700; box-shadow:0 4px 16px rgba(0,0,0,.1); }
    .hotspot { position:absolute; width:clamp(54px,6vw,76px); aspect-ratio:1; border:1px solid transparent; border-radius:50%; cursor:pointer; background:transparent; box-shadow:none; padding:0; transition:transform .2s,background .2s,box-shadow .2s,border-color .2s; }
    .hotspot::before { content:''; position:absolute; inset:16%; border-radius:50%; border:1px solid rgba(255,255,255,.22); box-shadow:0 0 14px rgba(255,255,255,.16); opacity:.35; animation:soft-glint 2.8s ease-in-out infinite; }
    .hotspot:hover, .hotspot:focus-visible, .hotspot.activating { transform:scale(1.08); outline:0; border-color:rgba(255,255,255,.92); background:radial-gradient(circle,rgba(255,239,159,.46),rgba(255,215,94,.12) 48%,transparent 70%); box-shadow:0 0 0 8px rgba(255,215,94,.2),0 0 30px rgba(255,239,159,.78); }
    .hotspot:hover::before, .hotspot:focus-visible::before, .hotspot.activating::before { inset:4%; border-color:rgba(255,255,255,.9); opacity:1; animation:tap-spark .42s ease-out; }
    .hotspot.done::before { border-color:rgba(255,255,255,.25); box-shadow:0 0 16px rgba(15,119,116,.2); }
    .hotspot.done:hover, .hotspot.done:focus-visible { background:radial-gradient(circle,rgba(122,222,209,.34),rgba(15,119,116,.08) 52%,transparent 72%); box-shadow:0 0 0 8px rgba(15,119,116,.14),0 0 26px rgba(122,222,209,.5); }
    .hotspot::after { content:attr(data-label); position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); white-space:nowrap; padding:6px 10px; border-radius:9px; background:rgba(9,61,61,.92); color:#fff; font-size:.74rem; opacity:0; pointer-events:none; transition:.2s; }
    .hotspot:hover::after, .hotspot:focus-visible::after { opacity:1; }
    @keyframes soft-glint { 50% { opacity:.7; box-shadow:0 0 19px rgba(255,255,255,.38); } }
    @keyframes tap-spark { from { transform:scale(.55); opacity:.2; } to { transform:scale(1); opacity:1; } }
    .storybar { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; align-items:center; min-height:104px; padding:18px 22px; background:#fff; border-top:1px solid #edf3ef; }
    .chapter-kicker { color:var(--coral); font-weight:700; font-size:.78rem; letter-spacing:.08em; }
    .objective { margin:4px 0 0; font-size:clamp(1rem,2vw,1.15rem); line-height:1.65; }
    .hint-btn { border:0; border-radius:14px; background:var(--teal); color:#fff; padding:13px 16px; font-weight:700; cursor:pointer; box-shadow:0 7px 0 var(--deep); }
    .hint-btn:active { transform:translateY(4px); box-shadow:0 3px 0 var(--deep); }
    .mobile-actions { display:none; padding:14px; gap:8px; overflow-x:auto; border-top:1px solid var(--line); background:#fffcf3; }
    .mobile-actions button { white-space:nowrap; border:1px solid var(--line); border-radius:999px; background:#fff; padding:10px 13px; font-weight:700; }
    .footerline { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-top:13px; color:#5c7777; font-size:.82rem; }
    .reset { border:0; background:transparent; text-decoration:underline; cursor:pointer; color:inherit; }
    dialog { width:min(520px,calc(100% - 26px)); max-height:calc(100dvh - 26px); overflow:auto; border:0; border-radius:24px; padding:0; color:var(--ink); background:var(--cream); box-shadow:0 30px 100px rgba(0,35,35,.38); }
    dialog::backdrop { background:rgba(7,57,57,.67); backdrop-filter:blur(5px); }
    .modal { padding:26px; }
    .modal-head { display:flex; gap:12px; align-items:flex-start; }
    .modal-icon { width:48px; height:48px; flex:0 0 auto; border-radius:16px; display:grid; place-items:center; background:var(--yellow); font-size:1.55rem; transform:rotate(-4deg); }
    .modal h2 { font-family:'Gaegu',cursive; font-size:2rem; margin:0; line-height:1; }
    .modal p { line-height:1.75; margin:14px 0; }
    .transition-art { width:100%; max-height:270px; object-fit:cover; display:block; margin:18px 0 20px; border-radius:18px; box-shadow:0 10px 28px rgba(13,86,84,.12); }
    .ending-art { width:100%; max-height:430px; object-fit:cover; display:block; margin:20px 0 18px; border-radius:20px; box-shadow:0 14px 34px rgba(13,86,84,.16); }
    .ending-copy { text-align:center; }
    .ending-copy h3 { font-family:'Gaegu',cursive; font-size:2rem; margin:8px 0 6px; color:var(--teal); }
    .ending-copy p { margin:8px 0; }
    .close { margin-left:auto; border:0; background:#fff; width:42px; height:42px; border-radius:50%; cursor:pointer; font-size:1.35rem; }
    .modal-actions { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:9px; margin-top:20px; }
    .primary, .secondary { min-height:46px; border-radius:13px; padding:0 17px; font-weight:700; cursor:pointer; }
    .primary { border:0; color:#fff; background:var(--teal); box-shadow:0 5px 0 var(--deep); }
    .secondary { border:1px solid var(--line); background:#fff; }
    .case-result { padding:26px; min-height:610px; }
    .case-result .start-card { padding-top:0; }
    .case-result .start-card p { margin:14px auto; line-height:1.75; font-size:1rem; }
    .case-result .items { margin:18px 0 8px; }
    .case-result .item { min-width:68px; padding:9px; }
    .case-result .modal-actions { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:9px; margin-top:20px; }
    .case-result .modal-actions button { width:100%; min-width:0; padding:0 12px; white-space:nowrap; font-size:1rem; }
    .code-row { display:flex; gap:9px; margin:15px 0 4px; }
    .code-row input { width:100%; min-height:52px; border:2px solid #b9d7d2; border-radius:13px; text-align:center; font-size:1.35rem; letter-spacing:.25em; background:#fff; }
    .sequence { display:flex; gap:9px; flex-wrap:wrap; margin:15px 0; }
    .sequence button { width:auto; min-width:56px; min-height:56px; padding:8px 12px; border:2px solid #bad8d4; background:#fff; border-radius:16px; font-size:1rem; line-height:1.35; font-weight:700; cursor:pointer; }
    .sequence button.selected { border-color:var(--coral); background:#fff0ed; transform:translateY(-3px); }
    .puzzle-feedback { min-height:24px; margin:8px 0 0; font-size:.9rem; font-weight:700; color:var(--coral); }
    .puzzle-feedback.ok { color:var(--teal); }
    .toast { position:fixed; left:50%; bottom:max(18px,env(safe-area-inset-bottom)); z-index:20; transform:translate(-50%,30px); opacity:0; max-width:calc(100% - 28px); background:#103f40; color:#fff; padding:12px 18px; border-radius:999px; box-shadow:0 12px 30px rgba(0,0,0,.25); font-weight:700; transition:.3s; pointer-events:none; text-align:center; }
    .toast.show { transform:translate(-50%,0); opacity:1; }
    .confetti { position:fixed; top:-20px; width:10px; height:16px; z-index:30; animation:fall 2.7s linear forwards; }
    @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
    .start-card { text-align:center; padding:5px 0 0; }
    .start-card .cat { font-size:4.5rem; filter:drop-shadow(0 8px 0 rgba(15,119,116,.12)); }
    .start-card h2 { font-size:2.3rem; margin:8px 0; }
    .start-card p { margin:8px auto 18px; max-width:390px; }
    .items { display:flex; justify-content:center; gap:8px; margin:15px 0; }
    .item { min-width:68px; padding:9px; border-radius:14px; background:#fff; border:1px solid var(--line); font-size:.82rem; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    @media (max-width:720px) {
      .shell { padding:10px 8px 20px; }
      .topbar { flex-wrap:wrap; }
      .brand { width:100%; }
      h1 { font-size:1.55rem; line-height:1.08; }
      .eyebrow { font-size:.68rem; }
      .game-card { border-radius:18px; }
      .scene-scroll {
        overflow-x:auto;
        overflow-y:hidden;
        -webkit-overflow-scrolling:touch;
        overscroll-behavior-x:contain;
        scrollbar-width:none;
        touch-action:pan-x pan-y;
        background:#dff1ef;
      }
      .scene-scroll::-webkit-scrollbar { display:none; }
      .scene {
        width:180vw;
        min-width:180vw;
        max-width:none;
        aspect-ratio:16/9;
        overflow:hidden;
      }
      .scene img { width:100%; height:100%; object-fit:cover; }
      .pan-guide {
        display:flex;
        align-items:center;
        justify-content:center;
        gap:6px;
        padding:8px 12px;
        background:#fffdf7;
        border-top:1px solid var(--line);
        color:#648080;
        font-size:.72rem;
        font-weight:700;
      }
      .chapter-tag { left:10px; bottom:10px; top:auto; padding:5px 9px; font-size:.66rem; background:rgba(255,255,255,.82); box-shadow:0 2px 8px rgba(0,0,0,.08); }
      .hotspot { width:56px; }
      .hotspot::after { display:none; }
      .storybar { grid-template-columns:1fr; padding:15px; gap:12px; }
      .hint-btn { width:100%; }
      .mobile-actions { display:flex; }
      .footerline { padding:0 4px; }
      .footerline span:first-child { display:none; }
      .sequence { gap:9px; flex-wrap:nowrap; }
      .sequence button { flex:0 0 56px; width:56px; min-width:56px; height:56px; min-height:56px; padding:0; font-size:1.45rem; }
      .sequence.wide-sequence { gap:7px; flex-wrap:wrap; }
      .sequence.wide-sequence button { flex:1 1 calc(50% - 7px); width:auto; min-width:120px; min-height:52px; height:auto; padding:8px 10px; font-size:.9rem; }
      .modal { padding:20px; }
      .modal h2 { font-size:1.55rem; line-height:1.08; }
      .modal-head { gap:9px; }
      .modal-icon { width:42px; height:42px; font-size:1.3rem; border-radius:13px; }
      .close { width:38px; height:38px; font-size:1.2rem; }
      .transition-art { width:100%; margin:16px 0 18px; max-height:220px; }
      .ending-art { max-height:360px; margin-top:17px; }
      .case-result { padding:20px; min-height:min(650px,calc(100dvh - 26px)); }
      .case-result .modal-head { margin-bottom:2px; }
      .case-result .start-card p { margin:12px auto; font-size:1rem; line-height:1.75; }
      .case-result .items { margin:15px 0 8px; gap:8px; }
      .case-result .item { min-width:0; flex:1; padding:8px 5px; font-size:.82rem; border-radius:12px; }
      .case-result .modal-actions { margin-top:18px; gap:8px; }
      .case-result .modal-actions button { min-height:46px; padding:0 8px; font-size:.9rem; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="eyebrow">NANA'S MORNING MISSION</div><h1>오늘은 내가 집사</h1></div>
      <div class="pill" aria-label="발견한 단서"><span>🐾</span><strong id="count">0</strong><span>/ 16</span></div>
      <button class="pill" id="sound" type="button" aria-pressed="false" aria-label="배경음악과 효과음 켜기" title="음악 켜기">🎵</button>
    </header>

    <section class="game-card" aria-live="polite">
      <div class="scene-scroll" id="sceneScroll">
        <div class="scene" id="scene">
          <img id="sceneImage" src="images/bedroom.webp" alt="늦잠 든 집사 옆에서 알람을 확인하는 나나">
          <div class="chapter-tag" id="chapterTag">01 · 침실</div>
          <div id="hotspots"></div>
        </div>
      </div>
      <div class="pan-guide" aria-hidden="true">↔ 좌우로 밀어 장면 전체를 둘러보세요</div>
      <div class="storybar">
        <div><div class="chapter-kicker" id="kicker">첫 번째 임무</div><p class="objective" id="objective">알람을 끄고 집사를 부드럽게 깨우자!</p></div>
        <button class="hint-btn" id="hint" type="button">나나의 힌트 🐾</button>
      </div>
      <div class="mobile-actions" id="mobileActions" aria-label="살펴볼 곳"></div>
    </section>

    <div class="footerline"><span>집 안의 물건을 누르면 나나의 아침 작전이 시작돼요.</span><button class="reset" id="reset" type="button">처음부터 다시 하기</button></div>
  </main>

  <dialog id="dialog"><div class="modal" id="modal"></div></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script>
    (() => {
      const chapters = [
        {
          tag:"01 · 침실", image:"images/bedroom.webp", successImage:"images/success-bedroom.webp", alt:"늦잠 든 집사 옆에서 알람을 확인하는 나나",
          kicker:"첫 번째 임무 · 기상 작전", objective:"알람을 끄고 집사를 부드럽게 깨우자!",
          hint:"출근 준비 60분과 이동 50분을 생각하면 9시 출근을 위해 7시 10분에는 일어나야 해. 집사를 깨울 때는 갑자기 덮치기보다 빛과 소리부터!",
          required:["alarm","wake"],
          successTitle:"기상 작전 성공!", successText:"나나는 알람을 정확히 맞추고 커튼을 열어 집사를 깨웠다. 이제 잠이 덜 깬 집사를 위해 커피를 준비하자!",
          spots:[
            {id:"schedule",label:"출근 메모",icon:"🗓️",x:72,y:22,title:"오늘의 출근 시간",text:"집사의 첫 일정은 <b>오전 9시</b>. 준비에는 60분, 이동에는 50분이 걸린다. 늦지 않으려면 몇 시에 일어나야 할까?",type:"clue"},
            {id:"alarm",label:"알람 시계",icon:"⏰",x:8,y:47,title:"기상 시간 입력",text:"9시 출근에서 준비 60분과 이동 50분을 거꾸로 계산해 네 자리 시간을 입력하자.",type:"code",answer:"0710",digits:4,reward:"알람 해제",success:"정답! 오전 7시 10분. 나나가 알람을 조용히 껐다."},
            {id:"phone",label:"충전 중인 휴대폰",icon:"📱",x:17,y:55,title:"집사의 아침 메모",text:"휴대폰 메모에는 이렇게 적혀 있다.<br><b>“알람이 울리면 커튼을 열고, 그다음 깨워 줘.”</b>",type:"clue"},
            {id:"wake",label:"잠든 집사",icon:"🐾",x:42,y:49,title:"집사 깨우기",text:"집사를 기분 좋게 깨우는 순서를 골라 보자!",type:"sequence",wide:true,options:["⏰ 알람 끄기","🪟 커튼 열기","🐾 앞발로 톡톡"],solution:[0,1,2],reward:"집사 기상",success:"알람 끄기 → 커튼 열기 → 앞발로 톡톡! 집사가 드디어 눈을 떴다."}
          ]
        },
        {
          tag:"02 · 주방", image:"images/kitchen.webp", successImage:"images/success-kitchen.webp", alt:"주방에서 집사의 커피를 준비하는 나나와 뒤에서 지켜보는 코코",
          kicker:"두 번째 임무 · 모닝커피", objective:"레시피를 확인해 집사의 커피를 완성하자!",

      $("#sound").onclick = async () => {
        state.sound=!state.sound;
        if(state.sound){ const c=ensureAudio(); if(c && c.state==="suspended") await c.resume(); startMusic(); showToast("포근한 아침 음악이 시작됐다냥 ♪"); }
        else stopMusic();
        renderHeader();
      };
      $("#reset").onclick = () => openModal("↩️","아침 작전을 다시 시작할까?","<p>찾은 단서와 진행 상황이 모두 초기화돼요.</p>",[
        {label:"계속할래",action:() => dialog.close()},
        {label:"처음부터",primary:true,action:restart}
      ]);
      dialog.addEventListener("click",e => { if(e.target===dialog && !locked) dialog.close(); });
      dialog.addEventListener("cancel",e => { if(locked) e.preventDefault(); });
      render(); setTimeout(intro,220);
    })();
  </script>
</body>
</html>
