function hide(){if(!$('overlay').classList.contains('open'))return;$('overlay').classList.remove('open');$('overlay').setAttribute('aria-hidden','true');document.body.style.overflow='';document.querySelector('main').inert=false;if(previousFocus&&previousFocus.isConnected){try{previousFocus.focus({preventScroll:true})}catch(e){previousFocus.focus()}}}
$('close').onclick=hide;$('overlay').onclick=e=>{if(e.target===$('overlay')&&!$('close').hidden)hide();};document.addEventListener('keydown',e=>{if(!$('overlay').classList.contains('open'))return;if(e.key==='Escape'&&!$('close').hidden)hide();if(e.key==='Tab'){const list=[...$('overlay').querySelectorAll('button,input')].filter(x=>!x.hidden&&!x.disabled);if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
function render(){const r=rooms[room];$('progress').innerHTML=rooms.map((x,i)=>`<div class="step ${i===room?'active':rewards[i]?'done':''}">${String(i+1).padStart(2,'0')} · ${['도쿄','교토','오사카','삿포로'][i]}</div>`).join('');$('roomTitle').textContent=r.title;$('roomCopy').textContent=r.copy;$('speech').textContent=r.speech;$('location').textContent=String(room+1).padStart(2,'0')+' · '+r.title;$('sceneImg').alt=r.title+'의 코코와 나나';$('tools').replaceChildren();$('spots').replaceChildren();r.objects.forEach(([name,x,y],i)=>{const done=i%2===1&&solved[room][Math.floor(i/2)],b=button(name+(done?' ✓':''),()=>inspect(i));$('tools').append(b);const s=button('',()=>inspect(i));s.className='hotspot'+(done?' solved':'');s.style.left=x+'%';s.style.top=y+'%';s.setAttribute('aria-label',name);$('spots').append(s)});$('tokens').innerHTML=rooms.map((x,i)=>`<div class="token ${rewards[i]?'got':''}"><b>${x.icon}</b>${rewards[i]?x.token:'아직 여행 전'}</div>`).join('');$('count').textContent=rewards.filter(Boolean).length+' / 4';}
function inspect(i){if(busy)return;const q=Math.floor(i/2);if(i%2===0){visited[room][q]=true;popup(rooms[room].objects[i][0],'<p>'+rooms[room].clues[q]+'</p>');}else quiz(q);}
function quiz(q){const x=rooms[room].quizzes[q];if(solved[room][q])return popup(x.title,'<p>이미 해결한 퍼즐이야. 다른 단서도 살펴보자.</p>');let selected=[];popup(x.title,`<p>${x.question}</p>${x.type==='code'?'<input id="answer" class="code" aria-label="암호 입력" inputmode="numeric" autocomplete="off" maxlength="3"><p class="feedback" id="feedback" aria-live="polite"></p>':'<div id="selection" class="sequence">'+(x.type==='seq'?'순서대로 골라주세요':'알맞은 답을 골라주세요')+'</div><div id="choices" class="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p>'}`,[['단서 보기',()=>{visited[room][q]=true;popup(rooms[room].objects[q*2][0],'<p>'+rooms[room].clues[q]+'</p>',[['퍼즐로 돌아가기',()=>quiz(q),true]])}],['닫기',hide]]);const wrong=()=>{$('feedback').textContent='아직 맞지 않아. 단서를 다시 살펴볼까?';};if(x.type==='code'){const submit=button('암호 확인',()=>{if($('answer').value.trim()===x.answer)complete(q);else wrong()},true);$('popupActions').append(submit);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')submit.click()});}else{x.options.forEach(opt=>$('choices').append(button(opt,()=>{if(x.type==='choice'){if(opt===x.answer)complete(q);else wrong();return}selected.push(opt);$('selection').textContent=selected.join(' → ');$('feedback').textContent='';if(selected.length===x.answer.length){if(selected.every((v,i)=>v===x.answer[i]))complete(q);else{wrong();selected=[];$('selection').textContent='순서를 다시 골라주세요';}}})));if(x.type==='seq')$('popupActions').append(button('선택 지우기',()=>{selected=[];$('selection').textContent='순서대로 골라주세요';$('feedback').textContent=''}));}}
async function complete(q){const run=epoch;if(solved[room][q])return;solved[room][q]=true;render();if(!solved[room].every(Boolean)){popup('첫 번째 퍼즐 해결!','<p>도장을 받을 준비가 반쯤 끝났어. 이 장소의 남은 퍼즐도 해결해보자.</p>',[['계속 탐색하기',hide,true]],true);return}busy=true;await preload(asset('success-'+(room+1)));if(run!==epoch)return;rewards[room]=true;busy=false;render();popup(rooms[room].success,`<img src="${asset('success-'+(room+1))}" alt="${rooms[room].success}"><p>${rooms[room].result}</p><div class="clue">${rooms[room].icon} <b>${rooms[room].token}</b> 획득</div>`,[[room===rooms.length-1?'이야기의 결말 보기':'다음 장소로 →',()=>{hide();if(room===rooms.length-1)ending();else go(room+1)},true]],true);}
async function go(next){const run=epoch;if(busy)return;busy=true;const imageReady=preload(asset('scene-'+(next+1)));$('fade').classList.add('cover');await new Promise(r=>setTimeout(r,250));await imageReady;if(run!==epoch)return;room=next;$('sceneImg').src=asset('scene-'+(room+1));$('sceneScroll').scrollLeft=0;render();requestAnimationFrame(()=>requestAnimationFrame(()=>{$('fade').classList.remove('cover');busy=false;}));}
async function ending(){ended=true;await preload(asset('ending'));popup('여행 끝에 남은 네 가지 추억',`<img src="${asset('ending')}" alt="고즈넉한 일본식 정원에서 여성용 기모노를 입은 코코와 나나"><p class="ending-label">THE END · 코코나나 일본 미션</p><p>도쿄의 반짝이는 타워, 교토의 꽃바람, 오사카의 강변 불빛, 삿포로의 새하얀 눈.</p><p>네 도장이 모인 여행 도장북을 덮고, 코코와 나나는 조용한 료칸의 정원으로 나왔어.</p><div class="clue">코코 “네 곳이나 여행했는데, 벌써 또 떠나고 싶어.”<br>나나 “다음에도 같이 가자. 길을 잃어도 함께 찾으면 되니까.”</div><p>꽃무늬 기모노를 입은 두 고양이가 나란히 인사했어.<br>우리의 다음 여행에서도 또 만나!</p>`,[['결말 닫기',hide],['다시 플레이하기',reset,true]],true);}
function intro(){popup('코코나나 일본 미션',`<img class="intro-art" src="${asset('scene-1')}" alt="도쿄타워 앞의 코코와 나나"><p>코코와 나나의 일본 여행이 시작됐어!<br>그런데 여행 도장북의 네 페이지가 텅 비어 있네?</p><p>도쿄 → 교토 → 도톤보리 → 삿포로.<br>여행지마다 숨은 단서를 찾아 도장을 모아보자.</p><div class="clue">그림 속 동그라미나 아래 탐색 버튼을 눌러봐.<br><b>각 장면의 퀴즈 2개를 모두 풀면 성공 일러스트와 다음 여행지가 열려.</b></div>`,[['여행 시작하기',hide,true]],true);}
function reset(){epoch++;hide();room=0;solved=rooms.map(()=>[false,false]);visited=rooms.map(()=>[false,false]);rewards.fill(false);busy=false;ended=false;$('fade').classList.remove('cover');$('sceneImg').src=asset('scene-1');$('sceneScroll').scrollLeft=0;render();intro();}
$('restart').onclick=()=>{if(busy)return;popup('처음부터 시작할까?','<p>지금까지 찾은 단서와 퍼즐 진행이 초기화돼.</p>',[['계속 플레이하기',hide],['처음부터',reset,true]])};$('note').onclick=()=>{let html='';rooms.forEach((r,i)=>{r.clues.forEach((c,q)=>{if(visited[i][q])html+=`<div class="note-row"><b>${r.title} · ${r.objects[q*2][0]}</b><div>${c}</div></div>`})});popup('단서 노트',html||'<p>아직 기록한 단서가 없어. 그림 속 물건을 살펴보자.</p>')};$('hint').onclick=()=>{if(ended)return ending();const q=solved[room].findIndex(v=>!v);popup('다음 한 걸음',q<0?'<p>이 장소의 퍼즐을 모두 해결했어.</p>':`<p><b>${rooms[room].quizzes[q].title}</b></p><p>${rooms[room].quizzes[q].hint}</p>`)};
window.addEventListener('resize',syncAppViewport);if(window.visualViewport)window.visualViewport.addEventListener('resize',syncAppViewport);window.addEventListener('pageshow',e=>{syncAppViewport();if(e.persisted)reset()});syncAppViewport();render();intro();
</script></body></html>
