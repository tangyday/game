</style></head><body><div id="gameBackdrop" aria-hidden="true"></div><main class="shell"><header class="topbar"><div class="brand"><div class="eyebrow">COCO & NANA · MAGIC SCHOOL</div><h1>코코와 나나의 마법학교 대소동</h1><p class="subtitle">사라진 별빛 마법서를 찾아라!</p></div><button class="pill" id="sound" aria-label="음악 켜기" aria-pressed="false">♫</button><button class="pill" id="notebook">📖 단서 노트</button><div class="pill" id="progress">마법 단서 0 / 3</div></header><nav class="map" id="map" aria-label="학교 지도"></nav><section class="game-card"><div class="scene-scroll" id="sceneScroll"><div class="scene" id="scene"><img id="sceneImage" alt="마법학교 중앙홀" decoding="sync"><div id="hotspots"></div><div class="chapter-tag" id="chapterTag"></div></div></div><div class="pan-guide">↔ 좌우로 밀어 장면 전체를 둘러보세요</div><div class="storybar"><div><div class="chapter-kicker" id="kicker"></div><p class="objective" id="objective"></p></div><button class="hint-btn" id="hint">코코와 나나의 힌트 🐾</button></div><div class="inventory" id="inventory"></div><div class="mobile-actions" id="mobileActions" aria-label="살펴볼 곳"></div></section><div class="footerline"><span>반짝이는 물건을 눌러 학교의 비밀을 찾아보세요.</span><button class="reset" id="reset">처음부터 다시 하기</button></div></main><div id="dialog" class="popup-overlay" aria-hidden="true"><div class="popup-panel" role="dialog" aria-modal="true" aria-labelledby="popupTitle" tabindex="-1"><div class="modal" id="modal"></div></div></div><div class="toast" id="toast" role="status"></div><script>(()=>{'use strict';
const $=s=>document.querySelector(s),dialog=$('#dialog'),modal=$('#modal');
const rooms=[
{name:'중앙홀',image:'hall',objective:'학교 곳곳에서 별 · 달 · 발바닥의 숫자를 찾아 잠긴 문을 열자.',hint:'마법약 교실에서는 별, 도서관에서는 달, 비행 연습장에서는 발바닥의 비밀을 찾을 수 있어.',spots:[['portrait','움직이는 초상화',11,29],['dust','별 모양 가루',51,77],['door','잠긴 문',87,46],['cats','코코와 나나',28,71]]},
{name:'마법약 교실',image:'potions',objective:'제조법에 맞춰 달빛 · 별빛 · 고양이의 꿈을 섞어 보자.',hint:'칠판의 색깔 대응표와 책상 위 제조법을 함께 읽어봐. 초록 물약은 쓰지 않아.',spots:[['board','칠판',25,25],['recipe','마법약 제조법',27,76],['potion','가마솥',65,64],['cats','코코와 나나',28,57]]},
{name:'움직이는 도서관',image:'library',objective:'「달을 깨우는 주문」의 둘째 글자를 읽어 달의 숫자를 알아내자.',hint:'두 글자씩 짝지어진 세 단어에서 두 번째 글자만 읽으면 어떤 문장이 될까?',spots:[['moonbook','달을 깨우는 주문',62,60],['books','날아다니는 책',35,28],['churu','츄르 소환술',84,42],['cats','코코와 나나',23,76]]},

{name:'금지된 마법실',image:'forbidden',objective:'황금 고양이 방울과 세 문양의 주문으로 별빛 마법서를 되찾자.',hint:'벽의 문구는 별 → 달 → 고양이 순서야. 고양이 문양을 깨우려면 황금 방울이 필요해.',spots:[['wall','벽의 주문',22,31],['glass','유리 상자',55,52],['ghost','작은 그림자',83,57],['cats','코코와 나나',24,77]]}
];
let state,room=0,ready=false,locked=false,audio=null,musicTimer=null,sound=false,selected=[];const cache={};

fresh();
function beep(freq=650,duration=.1){if(!sound||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}
function toggleSound(){sound=!sound;if(sound){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let n=0;const notes=[392,523.25,587.33,783.99,659.25,587.33,523.25,440];beep(notes[n++%8],.5);musicTimer=setInterval(()=>beep(notes[n++%8],.7),950);}catch(e){sound=false;}}else{clearInterval(musicTimer);}$('#sound').setAttribute('aria-pressed',String(sound));$('#sound').setAttribute('aria-label',sound?'음악 끄기':'음악 켜기');$('#sound').classList.toggle('playing',sound);}
let popupOpen=false,returnFocus=null,previousOverflow='';
function showPopup(){
  if(!popupOpen){returnFocus=document.activeElement;previousOverflow=document.body.style.overflow;}
  popupOpen=true;
  dialog.classList.add('is-open');
  dialog.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  document.querySelector('.shell').setAttribute('aria-hidden','true');
  document.querySelector('.shell').inert=true;
  dialog.querySelector('.popup-panel').focus({preventScroll:true});
}
function hidePopup(){
  if(!popupOpen)return;
  popupOpen=false;
  dialog.classList.remove('is-open');
  dialog.setAttribute('aria-hidden','true');
  document.body.style.overflow=previousOverflow;
  document.querySelector('.shell').removeAttribute('aria-hidden');
  document.querySelector('.shell').inert=false;
  if(returnFocus&&returnFocus.isConnected)returnFocus.focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{
  if(!popupOpen)return;
  if(e.key==='Escape'){e.preventDefault();close();return;}
  if(e.key!=='Tab')return;
  const items=Array.from(dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href]')).filter(el=>el.getClientRects().length);
  if(!items.length){e.preventDefault();return;}
  const first=items[0],last=items[items.length-1];
  if(e.shiftKey&&(document.activeElement===first||!items.includes(document.activeElement))){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&(document.activeElement===last||!items.includes(document.activeElement))){e.preventDefault();first.focus();}
});
function close(){if(!locked)hidePopup();}
function open(icon,title,html,actions=[],lock=false){locked=lock;modal.innerHTML=`<div class="modal-head"><div class="modal-icon">${icon}</div><div><div class="eyebrow">냥글냥글 마법학교</div><h2 id="popupTitle">${title}</h2></div>${lock?'':'<button class="close" aria-label="닫기">×</button>'}</div><div class="modal-body">${html}</div><div class="modal-actions"></div>`;const c=modal.querySelector('.close');if(c)c.onclick=close;for(const a of actions){const b=document.createElement('button');b.className=a.primary?'primary':'secondary';b.textContent=a.label;b.onclick=a.action;modal.querySelector('.modal-actions').append(b);}showPopup();dialog.scrollTop=0;}
function info(icon,title,html){open(icon,title,html,[{label:'확인했어!',primary:true,action:close}]);}
function art(name){return `<img class="success-art" src="images/${name}.webp" alt="${name==='ending'?'별빛 마법사 배지를 받은 코코와 나나':({"success-star": "별빛 마법약을 완성한 코코와 나나", "success-moon": "달의 주문을 해독한 코코와 나나", "success-bell": "황금 고양이 방울을 찾은 코코와 나나", "success-paw": "발자국 단서를 찾은 코코와 나나", "success-door": "마법실의 문을 연 코코와 나나", "success-book": "별빛 마법서를 되찾은 코코와 나나"})[name]||rooms.find(r=>r.image===name)?.name||'마법학교'}" decoding="sync">`;}
function talk(c,n){return `<div class="dialogue"><p><b>코코</b> “${c}”</p><p><b>나나</b> “${n}”</p></div>`;}
function render(){const r=rooms[room];$('#sceneImage').src=cache[r.image]?.src||`images/${r.image}.webp`;$('#sceneImage').alt=r.name+'의 코코와 나나';$('#chapterTag').textContent=`0${room+1} · ${r.name}`;$('#kicker').textContent=state.ended?'별빛 마법학교 · 사건 해결':'입학식 전의 작은 모험';$('#objective').textContent=r.objective;$('#progress').textContent=`마법 단서 ${['star','moon','paw'].filter(k=>state[k]!==null).length} / 3`;$('#inventory').innerHTML=[`⭐ ${state.star??'?'}`,`🌙 ${state.moon??'?'}`,`🐾 ${state.paw??'?'}`,state.bell?'🔔 황금 고양이 방울':'🎒 단서를 모아 보세요',state.book?'📘 별빛 마법서':''].filter(Boolean).map(s=>`<span>${s}</span>`).join('');$('#map').innerHTML='';rooms.forEach((r,i)=>{const b=document.createElement('button');b.textContent=(i===4&&!state.door?'🔒 ':'')+r.name;b.className=i===room?'active':'';b.disabled=i===4&&!state.door;b.setAttribute('aria-current',i===room?'page':'false');b.onclick=()=>go(i);$('#map').append(b);});$('#hotspots').innerHTML='';$('#mobileActions').innerHTML='';r.spots.forEach(([id,label,x,y])=>{const b=document.createElement('button');b.className='hotspot';b.style.left=`calc(${x}% - 29px)`;b.style.top=`calc(${y}% - 29px)`;b.dataset.label=label;b.setAttribute('aria-label',label);b.onclick=()=>inspect(id);$('#hotspots').append(b);const m=document.createElement('button');m.textContent=label;m.onclick=()=>inspect(id);$('#mobileActions').append(m);});}

function code(title,text,answer,win){open('🔐',title,`<p>${text}</p><form id="codeForm"><div class="code-row"><input id="code" inputmode="numeric" autocomplete="off" maxlength="${answer.length}" placeholder="${'0'.repeat(answer.length)}" aria-label="${answer.length}자리 암호"></div><p class="puzzle-feedback" id="feedback" aria-live="polite"></p></form>`,[{label:'나중에',action:close},{label:'확인하기',primary:true,action:check}]);function check(){if($('#code').value.trim()===answer){beep(900);win();}else{$('#feedback').textContent='아직 맞지 않아. 단서를 다시 살펴보자!';beep(200);}}$('#codeForm').onsubmit=e=>{e.preventDefault();check();};$('#code').focus();}
function sequence(icon,title,text,options,answer,win){selected=[];open(icon,title,`<p>${text}</p><div class="sequence" id="sequence"></div><p id="picked">선택: 아직 없음</p><p class="puzzle-feedback" id="feedback" aria-live="polite"></p>`,[{label:'다시 고르기',action:()=>{selected=[];modal.querySelectorAll('.sequence button').forEach(b=>b.classList.remove('selected'));$('#picked').textContent='선택: 아직 없음';$('#feedback').textContent='';}},{label:'주문 확인',primary:true,action:()=>{if(selected.join(',')===answer.join(',')){beep(1000);win();}else{$('#feedback').textContent='순서가 다른 것 같아. 힌트를 보고 다시 골라보자!';beep(200);}}}]);options.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(selected.includes(i)||selected.length>=answer.length)return;selected.push(i);b.classList.add('selected');$('#picked').textContent='선택: '+selected.map(j=>options[j]).join(' → ');$('#feedback').textContent='';beep(600+selected.length*100);};$('#sequence').append(b);});}
function solved(icon,title,html,image,nextRoom=null,nextLabel='다음 장소로 →'){render();open(icon,title,art(image)+html,[{label:nextRoom===null?'계속 탐색하기':nextLabel,primary:true,action:()=>{locked=false;hidePopup();if(nextRoom!==null)go(nextRoom);}}],true);}
function notebook(){info('📖','별빛 단서 노트',`<p>중앙홀 문에 새겨진 순서: <b>별 → 달 → 발바닥</b></p><div class="runes">⭐ ${state.star??'?'}　🌙 ${state.moon??'?'}　🐾 ${state.paw??'?'}</div><p>${state.star?'마법약에서 별의 숫자를 찾았다.':'별의 단서: 마법약 교실'}<br>${state.moon?'달을 깨우는 주문을 해독했다.':'달의 단서: 움직이는 도서관'}<br>${state.paw?'다섯 개의 발자국을 확인했다.':'발바닥의 단서: 빗자루 비행 연습장'}</p><p>${state.bell?'🔔 황금 고양이 방울을 가지고 있다.':'🎒 아직 황금 고양이 방울을 찾지 못했다.'}</p>`);}
function inspect(id){if(!ready||popupOpen)return;beep();if(id==='cats'){const lines=[['일단 저 문부터 눌러볼까?','잠깐. 단서부터 모으자. 또 폭발하면 어떡해.'],['반짝반짝! 한 모금만 마셔볼까?','마법약은 먹는 게 아니야. 제조법을 먼저 읽자.'],['책이 날아다녀! 잡아도 돼?','달을 깨우는 주문부터 찾아보자.'],['빗자루로 츄르 가게까지 날아가자!','우선 안전하게 출발하는 순서부터 배우자.'],['마법서가 바로 앞에 있어!','방울과 주문을 함께 사용해야 해.']][room];return info('🐾','두 신입생의 작전',talk(...lines));}
if(room===0){if(id==='portrait')return info('🖼️','말하는 초상화','<p>“마법서를 찾고 싶다면, 별이 잠든 곳부터 찾아보게.”</p><p>“별은 가마솥에서, 달은 책 속에서, 고양이의 발은 빗자루 곁에서 깨어나지.”</p>');if(id==='dust')return info('✨','별빛 가루의 흔적','<p>보라색 별빛 가루가 잠긴 문 아래로 이어진다. 문에는 세 문양이 차례로 새겨져 있다.</p><div class="runes">⭐ → 🌙 → 🐾</div>'+talk('이쪽으로 마법서가 지나갔나 봐!','각 문양의 숫자를 찾으면 문을 열 수 있겠어.'));if(id==='door'){if(state.door)return open('🚪','금지된 마법실','<p>잠금이 풀려 있다. 조심히 안으로 들어가 보자.</p>',[{label:'마법실로 들어가기',primary:true,action:()=>{hidePopup();go(4);}}]);if(['star','moon','paw'].some(k=>state[k]===null))return info('🔒','세 문양의 잠금','<div class="runes">⭐ 🌙 🐾</div><p>세 문양의 숫자를 아직 모두 찾지 못했다. 다른 교실을 탐색한 뒤 돌아오자.</p>');return code('중앙홀의 잠긴 문','별 → 달 → 발바닥의 숫자를 이어 세 자리 암호를 입력하자.','735',()=>{state.door=true;render();open('✨','금지된 마법실이 열렸다!',art('success-door')+'<p>7 · 3 · 5. 문양이 금빛으로 빛나며 문이 열렸다!</p>'+talk('찾았다! 마법서가 저 안에 있어!','황금 방울도 잘 챙겼지?'),[{label:'금지된 마법실로 →',primary:true,action:()=>{locked=false;hidePopup();go(4);}}],true);});}}
if(room===1){if(id==='board')return info('🧪','칠판의 색깔 비밀','<p><b>달빛에는 파란색<br>별빛에는 보라색<br>고양이의 꿈에는 분홍색</b></p><p>초록 물약은 식물 성장용. 오늘 제조법에는 쓰지 않는다.</p>');if(id==='recipe')return info('📜','별을 깨우는 마법약','<p>가마솥 옆 제조법을 펼쳤다.</p><div class="runes">달빛 → 별빛 → 꿈</div><p>각 재료에 맞는 색을 칠판에서 확인하자.</p>');if(id==='potion'){if(state.star)return info('⭐','깨어난 별의 숫자','<div class="runes">⭐ = 7</div><p>단서 노트에 기록되어 있다.</p>');return sequence('🧪','별빛 마법약 만들기','제조법 순서대로 세 가지 물약을 골라 가마솥에 넣자.',['분홍 물약','초록 물약','파란 물약','보라 물약'],[2,3,0],()=>{state.star=7;solved('⭐','별의 숫자를 발견했다!','<div class="runes">⭐ = 7</div>'+talk('우와! 연기 속에서 숫자가 나왔어!','성공이야. 그래도 먹는 건 아니지?'),'success-star',2,'움직이는 도서관으로 →');});}}
if(room===2){if(id==='books')return info('📚','혼자 날아다니는 책','<p>「고양이가 배우는 빗자루 비행」이 눈앞을 휙 지나간다.</p><p>「하루 만에 배우는 투명 마법」은 표지만 보이고 내용은 보이지 않는다.</p>'+talk('투명한 책이라니! 숙제도 안 보이면 좋겠다.','숙제는 보일 것 같은데.'));if(id==='churu')return info('🐟','츄르 소환술 100가지','<p><b>“츄르 소환술은 현재 대출 중입니다.”</b></p>'+talk('나나, 왜 갑자기 조용해졌어?','…오늘 가장 중요한 책을 놓쳤어.'));if(id==='moonbook'){if(state.moon)return info('🌙','깨어난 달의 숫자','<div class="runes">🌙 = 3</div>');return code('달을 깨우는 주문','“첫 번째 글자는 잠들고, 두 번째 글자는 깨어난다.”<br>두 글자씩 짝지어진 단어의 <b>둘째 글자만</b> 읽어 숫자를 입력하자.<div class="book-grid"><span>별달</span><span>꿈은</span><span>빛삼</span></div>','3',()=>{state.moon=3;solved('🌙','달이 깨어났다!','<p>둘째 글자를 읽으면 <b>달 · 은 · 삼</b>.</p><div class="runes">🌙 = 3</div>'+talk('달은 삼! 내가 주문을 읽었어!','세 글자가 하나의 문장이 되는 거였네.'),'success-moon',3,'빗자루 비행 연습장으로 →');});}}
if(room===3){if(id==='trail')return info('🧹','바닥에 남은 비행 흔적','<p>금빛 흔적이 네 문양을 이어 놓았다.</p><div class="runes">🐾 → ☁️ → ⭐ → 🌙</div><p>이 순서대로 빗자루를 깨워야 상자가 나타난다.</p>');if(id==='broom'){if(state.bell)return info('🧹','잠잠해진 빗자루','<p>네 빗자루가 나란히 기다리고 있다. 상자에서 발자국 메모를 확인해 보자.</p>');return sequence('🧹','빗자루의 비행 주문','바닥에 남은 흔적의 순서대로 문양을 눌러 보자.',['⭐ 별','🐾 발바닥','🌙 달','☁️ 구름'],[1,3,0,2],()=>{state.bell=true;solved('🔔','황금 고양이 방울 발견!','<p>숨겨진 상자가 열렸다. 황금 고양이 방울을 가방에 넣었다.</p><p><b>상자를 다시 살펴보면 발바닥의 숫자를 알 수 있어.</b></p>'+talk('딸랑! 왠지 중요한 물건 같아.','상자 안의 메모도 놓치지 말자.'),'success-bell');});}if(id==='chest'){if(!state.bell)return info('📦','마법에 숨겨진 상자','<p>상자가 희미하게 보이지만 손이 통과한다. 빗자루의 문양 주문부터 풀어야 한다.</p>');if(state.paw)return info('🐾','발바닥의 숫자','<div class="runes">🐾 = 5</div><p>황금 고양이 방울과 숫자 단서를 모두 챙겼다.</p>');return code('상자 속 발자국 메모','“고양이는 네 걸음을 걷고, 마지막 발도장으로 멈춘다.”<br><b>첫 네 걸음과 마지막 발도장을 모두 세어 보자.</b><div class="footprints">🐾 🐾 🐾 🐾<br>🐾</div>','5',()=>{state.paw=5;solved('🐾','발바닥 숫자까지 찾았다!','<div class="runes">🐾 = 5</div><p>중앙홀의 잠긴 문으로 돌아가 세 숫자를 사용해 보자.</p>','success-paw',0,'중앙홀로 돌아가기 →');});}}
if(room===4){if(id==='wall')return info('📜','마지막 주문','<p><b>별은 길을 밝히고<br>달은 밤을 지키며<br>고양이는 문을 연다.</b></p><p>작은 문장도 있다. “황금 방울의 소리로 고양이 문양을 깨워라.”</p>');if(id==='ghost')return info('👻','책장 뒤 작은 그림자','<p>작은 고양이 모양의 그림자가 움찔한다.</p><p>“마, 마법서를 찾으러 왔어…?”</p>'+talk('무서워하지 마. 우리는 신입생이야!','먼저 상자를 열고 이야기를 듣자.'));if(id==='glass'){if(state.ended)return ending();if(!state.bell)return info('🔔','잠든 고양이 문양','<p>고양이 문양을 깨울 황금 방울이 필요하다. 비행 연습장으로 돌아가 보자.</p>');return sequence('📘','별빛 마법서의 봉인','황금 방울을 딸랑 울렸다. 벽의 주문대로 세 문양을 눌러 보자.',['🌙 달','🐾 발바닥','⭐ 별'],[2,0,1],()=>{state.book=true;render();open('👻','마법서를 숨긴 건…',art('success-book')+'<p>유리 상자가 열리자 작은 유령 고양이가 나타났다.</p><div class="dialogue"><p><b>유령 고양이</b> “미안하다냥… 나도 입학식에서 마법을 보여주고 싶었어. 연습하다가 실수로 마법서를 여기에 떨어뜨렸어…”</p></div>'+talk('그럼 우리랑 같이 돌아가자!','같이 연습하면 다음엔 잘할 수 있을 거야.'),[{label:'마법서를 들고 중앙홀로 →',primary:true,action:()=>{locked=false;hidePopup();state.ended=true;room=0;render();$('#sceneImage').src=cache.ending.src;$('#sceneImage').alt='별빛 아래서 배지를 받은 코코와 나나';$('#sceneScroll').scrollLeft=0;ending();}}],true);});}}
}
function ending(){state.ended=true;open('✨','마법학교의 첫 번째 사건 해결!',art('ending')+'<div class="ending-copy"><p>별빛 마법서가 돌아오자 학교 천장이 밤하늘로 변하고 별들이 반짝였다.</p><div class="dialogue"><p><b>교장선생님</b> “첫날부터 학교를 구하다니… 아주 특별한 신입생들이 들어왔구나.”</p></div><h3>별빛 마법사 배지 획득!</h3>'+talk('우리 진짜 마법사가 된 거야?','그럼 이제 츄르 소환 마법도 배울 수 있어?')+'<p>코코와 나나의 마법학교 생활은 이제 시작입니다.</p><p class="ending-tease">다음 수업: 금지된 숲의 이상한 울음소리</p></div>',[{label:'다시 플레이하기',primary:true,action:restart}],true);}
function intro(){open('💌','냥글냥글 마법학교에 온 걸 환영해!',art('hall')+'<p>“축하합니다! 코코와 나나 학생은 냥글냥글 마법학교의 신입생으로 선발되었습니다.”</p><p>그런데 입학식 직전, <b>별빛 마법서가 사라졌다!</b> 밤 12시가 되면 학교의 모든 마법이 사라진다.</p><div class="dialogue"><p><b>교장선생님</b> “마법서는 학교 안에 있다냥. 너희 둘이라면… 찾을 수 있을지도 모르겠구나.”</p></div><p>다섯 장소를 돌아다니며 반짝이는 물건을 누르고 단서를 모아 주세요. <b>제한 시간은 없으니 천천히 탐색해도 괜찮아요.</b></p>',[{label:'별빛 마법서 찾으러 가기 →',primary:true,action:()=>{locked=false;hidePopup();}}],true);}
function restart(){locked=false;hidePopup();fresh();render();$('#sceneScroll').scrollLeft=0;intro();}
$('#sound').onclick=toggleSound;$('#notebook').onclick=notebook;$('#hint').onclick=()=>{
  const allCluesFound=['star','moon','paw'].every(key=>state[key]!==null);
  const hint=allCluesFound&&!state.door
    ? (room===0
      ? '별 · 달 · 발바닥의 숫자를 모두 찾았어! 중앙홀의 잠긴 문을 누르고, 별 → 달 → 발바닥 순서로 숫자를 입력해 보자.'
      : '별 · 달 · 발바닥의 숫자를 모두 찾았어! 위쪽 지도에서 중앙홀로 돌아가 잠긴 문을 눌러 봐. 별 → 달 → 발바닥 순서로 숫자를 입력하면 돼.')
    : rooms[room].hint;
  info('🐾','코코와 나나의 힌트',talk('이제 어디로 가면 좋을까?',hint));
};$('#reset').onclick=()=>open('↩','처음부터 다시 할까?','<p>모은 단서와 아이템이 모두 초기화돼.</p>',[{label:'계속 탐색하기',action:close},{label:'다시 시작',primary:true,action:restart}]);dialog.addEventListener('click',e=>{if(e.target===dialog&&!locked)hidePopup();});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(musicTimer);audio?.suspend();}else if(sound){sound=false;toggleSound();}});window.addEventListener('pageshow',e=>{if(e.persisted)restart();});
render();open('✨','마법학교로 가는 중…','<p class="loading-card" id="loadingText">일러스트를 미리 준비하고 있어요. 잠시만 기다려 주세요.</p>',[],true);
async function prepare(){const failed=[];await Promise.all(['hall','potions','library','flight','forbidden','ending','success-star','success-moon','success-bell','success-paw','success-door','success-book'].map(name=>new Promise(resolve=>{const im=new Image();im.onload=async()=>{try{await im.decode();}catch(e){}cache[name]=im;resolve();};im.onerror=()=>{failed.push(name);resolve();};im.src=`images/${name}.webp`;})));if(failed.length){open('🌙','그림을 불러오지 못했어요','<p>index.html과 images 폴더가 함께 있는지 확인해 주세요.</p><p class="ready-error">누락: '+failed.join(', ')+'</p>',[{label:'다시 불러오기',primary:true,action:prepare}],true);return;}try{await Promise.all([document.fonts.load('700 24px Gaegu'),document.fonts.load('400 18px Gaegu')]);}catch(e){}ready=true;render();intro();}
prepare();
})();
</script></body></html>
