큰 행성! 잠든 씨앗을 깨우고 꽃들의 신호를 읽으면 숲의 출구가 열릴 거야.", "speech": "코코 “이 잎이면 우리 둘이 낮잠 자도 남겠는데?”", "token": "초록 좌표", "icon": "🌱", "success": "거대한 꽃이 별빛을 펼쳤다!", "result": "꽃잎 속에서 초록 좌표가 반짝였다. 잎들이 접히며 숨겨진 발사대를 드러냈어. 마지막 좌표는 바닷속에 잠들어 있어.", "objects": [["이슬 기록", 16, 40], ["씨앗 캡슐", 84, 52], ["꽃의 신호", 62, 20], ["뿌리 문", 46, 82]], "clues": ["거대한 이슬방울에 씨앗의 일기가 비쳤다.<div class=\"clue\">“처음엔 목이 말랐고, 그다음엔 따뜻함이 필요했고, 마지막엔 자랄 곳이 필요했어.”<br><b>물 → 햇빛 → 흙</b></div>", "꽃 세 송이가 차례대로 피어났다.<div class=\"clue\">첫 꽃: 꽃잎 <b>5장</b><br>둘째 꽃: 꽃잎 <b>3장</b><br>셋째 꽃: 꽃잎 <b>7장</b><br>뿌리 문은 꽃이 핀 순서를 기억한다.</div>"], "quizzes": [{"type": "seq", "title": "잠든 씨앗 깨우기", "question": "이슬에 비친 씨앗의 일기대로 세 가지 선물을 주자.", "answer": ["물", "햇빛", "흙"], "hint": "목마름에는 물, 따뜻함에는 햇빛, 자랄 곳에는 흙이야.", "options": ["흙", "바람", "물", "햇빛"]}, {"type": "code", "title": "꽃잎의 암호", "question": "먼저 핀 꽃부터 꽃잎의 수를 이어 세 자리 암호를 입력하자.", "answer": "537", "hint": "꽃의 신호에서 첫 꽃 5, 둘째 꽃 3, 셋째 꽃 7을 확인해봐."}]}, {"title": "바다 행성 · 아쿠아루나", "copy": "행성 전체가 바다로 덮여 있어. 투명한 탐사 돔 안에서 산호의 노래를 듣고, 집으로 향하는 별문을 열자.", "speech": "나나 “우주에서 바닷속을 보게 될 줄은 몰랐어.”", "token": "보랏빛 좌표", "icon": "🐚", "success": "바닷속에 귀환 별문이 열렸다!", "result": "진주 조개에서 마지막 좌표가 떠올랐다. 네 개의 빛이 만나자 바다 위로 집을 향하는 항로가 이어졌어.", "objects": [["진주 조개", 17, 40], ["해류 나침반", 82, 57], ["산호 풍경", 64, 24], ["귀환 별문", 43, 80]], "clues": ["진주 조개 안에 항해사의 메모가 들어 있다.<div class=\"clue\">“해류는 동쪽에서 시작해, 북쪽을 지나, 서쪽으로 흐른다.”<br><b>동쪽 → 북쪽 → 서쪽</b></div>", "산호 풍경이 네 별빛의 숫자를 노래했다.<div class=\"clue\">얼음 = <b>2</b> · 간식 = <b>8</b><br>식물 = <b>5</b> · 바다 = <b>4</b><br>별문의 마지막 질문: <b>네 숫자를 모두 더하면?</b></div>"], "quizzes": [{"type": "seq", "title": "안전한 해류 찾기", "question": "항해사의 메모를 따라 해류의 방향을 순서대로 선택하자.", "answer": ["동쪽", "북쪽", "서쪽"], "hint": "진주 조개의 메모는 동쪽 → 북쪽 → 서쪽 순서야.", "options": ["북쪽", "서쪽", "남쪽", "동쪽"]}, {"type": "code", "title": "귀환 별문 열기", "question": "네 행성의 별빛 숫자 2, 8, 5, 4를 모두 더한 값을 입력하자.", "answer": "19", "hint": "2 + 8 = 10, 5 + 4 = 9. 두 값을 합쳐봐."}]}];

function button(label,fn,primary=false){const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.addEventListener('click',fn);return b;}
function syncAppViewport(){const h=Math.round((window.visualViewport&&window.visualViewport.height)||window.innerHeight||document.documentElement.clientHeight||800);document.documentElement.style.setProperty('--app-vh',h+'px');}
function popup(title,html,actions=[['확인',hide,true]],mandatory=false){syncAppViewport();previousFocus=document.activeElement;$('popupTitle').textContent=title;$('popupBody').innerHTML=html;$('popupBody').scrollTop=0;$('popupActions').replaceChildren();actions.forEach(([label,fn,p])=>$('popupActions').append(button(label,fn,p)));$('close').hidden=mandatory;$('overlay').classList.add('open');$('overlay').setAttribute('aria-hidden','false');document.querySelector('main').setAttribute('inert','');document.body.style.overflow='hidden';requestAnimationFrame(()=>{const el=$('close').hidden?$('popupActions').querySelector('button'):$('close');if(el){try{el.focus({preventScroll:true})}catch(e){}}});}
function hide(){if(!$('overlay').classList.contains('open'))return;$('overlay').classList.remove('open');$('overlay').setAttribute('aria-hidden','true');document.querySelector('main').removeAttribute('inert');document.body.style.overflow='';if(previousFocus&&previousFocus.isConnected){try{previousFocus.focus({preventScroll:true})}catch(e){previousFocus.focus()}}}
$('close').onclick=hide;$('overlay').onclick=e=>{if(e.target===$('overlay')&&!$('close').hidden)hide();};document.addEventListener('keydown',e=>{if(!$('overlay').classList.contains('open'))return;if(e.key==='Escape'&&!$('close').hidden)hide();if(e.key==='Tab'){const list=[...$('overlay').querySelectorAll('button,input')].filter(x=>!x.hidden&&!x.disabled);if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
function render(){const r=rooms[room];$('progress').innerHTML=rooms.map((x,i)=>`<div class="step ${i===room?'active':rewards[i]?'done':''}">${String(i+1).padStart(2,'0')} · ${['얼음 행성','간식 행성','식물 행성','바다 행성'][i]}</div>`).join('');$('roomTitle').textContent=r.title;$('roomCopy').textContent=r.copy;$('speech').textContent=r.speech;$('location').textContent=String(room+1).padStart(2,'0')+' · '+r.title;$('sceneImg').alt=r.title+'의 코코와 나나';$('tools').replaceChildren();$('spots').replaceChildren();r.objects.forEach(([name,x,y],i)=>{const done=i%2===1&&solved[room][Math.floor(i/2)],b=button(name+(done?' ✓':''),()=>inspect(i));$('tools').append(b);const s=button('',()=>inspect(i));s.className='hotspot'+(done?' solved':'');s.style.left=x+'%';s.style.top=y+'%';s.setAttribute('aria-label',name);$('spots').append(s)});$('tokens').innerHTML=rooms.map((x,i)=>`<div class="token ${rewards[i]?'got':''}"><b>${x.icon}</b>${rewards[i]?x.token:'아직 발견 전'}</div>`).join('');$('count').textContent=rewards.filter(Boolean).length+' / 4';}
function inspect(i){if(busy)return;const q=Math.floor(i/2);if(i%2===0){visited[room][q]=true;popup(rooms[room].objects[i][0],'<p>'+rooms[room].clues[q]+'</p>');}else quiz(q);}
function quiz(q){const x=rooms[room].quizzes[q];if(solved[room][q])return popup(x.title,'<p>이미 해결한 퍼즐이야. 다른 단서도 살펴보자.</p>');let selected=[];popup(x.title,`<p>${x.question}</p>${x.type==='code'?'<input id="answer" class="code" aria-label="암호 입력" inputmode="numeric" autocomplete="off" maxlength="3" pattern="[0-9]*"><p class="feedback" id="feedback" aria-live="polite"></p>':'<div id="selection" class="sequence">'+(x.type==='seq'?'순서대로 골라주세요':'알맞은 답을 골라주세요')+'</div><div id="choices" class="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p>'}`,[['단서 보기',()=>{visited[room][q]=true;popup(rooms[room].objects[q*2][0],'<p>'+rooms[room].clues[q]+'</p>',[['퍼즐로 돌아가기',()=>quiz(q),true]])}],['닫기',hide]]);const wrong=()=>{$('feedback').textContent='아직 맞지 않아. 단서를 다시 살펴볼까?';};if(x.type==='code'){const submit=button('암호 확인',()=>{if($('answer').value.trim()===x.answer)complete(q);else wrong()},true);$('popupActions').append(submit);const answer=$('answer');answer.addEventListener('keydown',e=>{if(e.key==='Enter')submit.click()});requestAnimationFrame(()=>requestAnimationFrame(()=>{try{answer.focus({preventScroll:true})}catch(e){answer.focus()}}));}else{x.options.forEach(opt=>$('choices').append(button(opt,()=>{if(x.type==='choice'){if(opt===x.answer)complete(q);else wrong();return}selected.push(opt);$('selection').textContent=selected.join(' → ');$('feedback').textContent='';if(selected.length===x.answer.length){if(selected.every((v,i)=>v===x.answer[i]))complete(q);else{wrong();selected=[];$('selection').textContent='순서를 다시 골라주세요';}}})));if(x.type==='seq')$('popupActions').append(button('선택 지우기',()=>{selected=[];$('selection').textContent='순서대로 골라주세요';$('feedback').textContent=''}));}}
async function complete(q){if(busy||solved[room][q])return;solved[room][q]=true;render();if(!solved[room].every(Boolean)){popup('첫 번째 퍼즐 해결!','<p>별빛 장치가 반응하기 시작했어. 이 행성의 남은 미션도 해결해보자.</p>',[['계속 탐색하기',hide,true]],true);return}busy=true;await preload(asset('success-'+(room+1)));rewards[room]=true;busy=false;render();popup(rooms[room].success,`<img src="${asset('success-'+(room+1))}" alt="${rooms[room].success}"><p>${rooms[room].result}</p><div class="clue">${rooms[room].icon} <b>${rooms[room].token}</b> 획득</div>`,[[room===3?'이야기의 결말 보기':'다음 장소로 →',()=>{hide();if(room===3)ending();else go(room+1)},true]],true);}
async function go(next){if(busy)return;busy=true;const imageReady=preload(asset('scene-'+(next+1)));$('fade').classList.add('cover');await new Promise(r=>setTimeout(r,250));await imageReady;room=next;$('sceneImg').src=asset('scene-'+(room+1));$('sceneScroll').scrollLeft=0;render();requestAnimationFrame(()=>requestAnimationFrame(()=>{$('fade').classList.remove('cover');busy=false;}));}
async function ending(){ended=true;await preload(asset('ending'));popup('가장 좋은 행성은, 우리 집',`<img src="${asset('ending')}" alt="지구로 돌아가는 우주선 안에서 쉬는 코코와 나나"><p class="ending-label">THE END · 별별 행성 탐험대</p><p>얼음 다리, 쿠키 산, 거대한 잎, 바닷속 별문.<br>네 행성이 보내준 빛이 우주선의 창을 따뜻하게 밝혔어.</p><div class="clue">코코 “어떤 행성이 제일 좋았어?”<br>나나 “간식 행성… 아니, 우리 집.”</div><p>창밖으로 익숙한 파란 행성이 가까워졌어. 코코는 나나 곁에 몸을 기대고 눈을 감았지.</p><p>우주에는 신기한 행성이 많지만, 함께 돌아갈 집이 있다는 건 더 멋진 일이야.</p><p>나나는 탐험 일지에 마지막 한 줄을 적었어.<br><b>‘다음 여행에는 간식 가방을 더 크게 가져갈 것.’</b></p>`,[['결말 닫기',hide],['다시 플레이하기',reset,true]],true);}
function intro(){popup('별별 행성 탐험대, 출발!',`<img class="intro-art" src="${asset('scene-1')}" alt="얼음 행성을 탐험하는 코코와 나나"><p>우주정거장을 떠난 코코와 나나.<br>반짝이는 유성 먼지를 지나자 귀환 항로가 사라져버렸어!</p><p>집으로 돌아가려면 네 행성에 숨겨진 별빛 좌표를 모아야 해. 얼음, 간식, 식물, 바다… 어디부터 탐험해볼까?</p><div class="clue">그림의 연한 동그라미나 아래 탐색 버튼을 눌러 단서를 찾아봐.<br><b>각 행성의 두 미션을 해결하면 다음 행성으로 이동할 수 있어.</b><br>찾은 단서는 단서 노트에 기록돼.</div>`,[['얼음 행성 탐험하기',hide,true]],true);}

function reset(){hide();room=0;solved=rooms.map(()=>[false,false]);visited=rooms.map(()=>[false,false]);rewards.fill(false);busy=false;ended=false;$('fade').classList.remove('cover');$('sceneImg').src=asset('scene-1');$('sceneScroll').scrollLeft=0;render();intro();}
$('restart').onclick=()=>{if(busy)return;popup('처음부터 시작할까?','<p>지금까지 찾은 단서와 퍼즐 진행이 초기화돼.</p>',[['계속 플레이하기',hide],['처음부터',reset,true]])};$('note').onclick=()=>{let html='';rooms.forEach((r,i)=>{r.clues.forEach((c,q)=>{if(visited[i][q])html+=`<div class="note-row"><b>${r.title} · ${r.objects[q*2][0]}</b><div>${c}</div></div>`})});popup('단서 노트',html||'<p>아직 기록한 단서가 없어. 그림 속 물건을 살펴보자.</p>')};$('hint').onclick=()=>{if(ended)return ending();const q=solved[room].findIndex(v=>!v);popup('다음 한 걸음',q<0?'<p>이 장소의 퍼즐을 모두 해결했어.</p>':`<p><b>${rooms[room].quizzes[q].title}</b></p><p>${rooms[room].quizzes[q].hint}</p>`)};
window.addEventListener('resize',syncAppViewport);if(window.visualViewport)window.visualViewport.addEventListener('resize',syncAppViewport);window.addEventListener('pageshow',e=>{syncAppViewport();if(e.persisted)reset()});syncAppViewport();render();intro();
</script></body></html>
