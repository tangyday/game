let room=0,solved=rooms.map(()=>[false,false]),visited=rooms.map(()=>[false,false]),rewards=rooms.map(()=>false),busy=false,ended=false,previousFocus=null,scrollY=0,epoch=0;
const $=id=>document.getElementById(id),asset=n=>'images/'+n+'.webp?v=shanghai1';
const cache=new Map();function preload(src){if(cache.has(src))return cache.get(src);const p=new Promise(resolve=>{const i=new Image();i.onload=()=>{if(i.decode)i.decode().catch(()=>{}).then(()=>resolve(i));else resolve(i)};i.onerror=()=>resolve(null);i.src=src});cache.set(src,p);return p;}
[...rooms.map((_,i)=>'scene-'+(i+1)),...rooms.map((_,i)=>'success-'+(i+1)),'ending'].forEach(n=>preload(asset(n)));
function button(label,fn,primary=false){const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.addEventListener('click',fn);return b;}
function syncAppViewport(){const h=Math.round((window.visualViewport&&window.visualViewport.height)||window.innerHeight||document.documentElement.clientHeight||800);document.documentElement.style.setProperty('--app-vh',h+'px');}
function popup(title,html,actions=[['확인',hide,true]],mandatory=false){syncAppViewport();previousFocus=document.activeElement;$('popupTitle').textContent=title;$('popupBody').innerHTML=html;$('popupBody').scrollTop=0;$('popupActions').replaceChildren();actions.forEach(([label,fn,p])=>$('popupActions').append(button(label,fn,p)));$('close').hidden=mandatory;$('overlay').classList.add('open');$('overlay').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.querySelector('main').inert=true;const numericInput=$('popupBody').querySelector('input[inputmode="numeric"]');if(numericInput){try{numericInput.focus({preventScroll:true})}catch(e){numericInput.focus()}}else if(!matchMedia('(pointer:coarse)').matches){requestAnimationFrame(()=>{if(!$('overlay').classList.contains('open')||$('popupBody').querySelector('input[inputmode="numeric"]'))return;try{$('popupTitle').focus({preventScroll:true})}catch(e){}})} }
function hide(){if(!$('overlay').classList.contains('open'))return;$('overlay').classList.remove('open');$('overlay').setAttribute('aria-hidden','true');document.body.style.overflow='';document.querySelector('main').inert=false;if(previousFocus&&previousFocus.isConnected){try{previousFocus.focus({preventScroll:true})}catch(e){/* Avoid scrolling fallback on older WebViews. */}}}
$('close').onclick=hide;$('overlay').onclick=e=>{if(e.target===$('overlay')&&!$('close').hidden)hide();};document.addEventListener('keydown',e=>{if(!$('overlay').classList.contains('open'))return;if(e.key==='Escape'&&!$('close').hidden)hide();if(e.key==='Tab'){const list=[...$('overlay').querySelectorAll('button,input')].filter(x=>!x.hidden&&!x.disabled);if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
function render(){const r=rooms[room];$('progress').innerHTML=rooms.map((x,i)=>`<div class="step ${i===room?'active':rewards[i]?'done':''}">${String(i+1).padStart(2,'0')} · ${['쇼핑몰','예원','난징동루','식당','와이탄'][i]}</div>`).join('');$('roomTitle').textContent=r.title;$('roomCopy').textContent=r.copy;$('speech').textContent=r.speech;$('location').textContent=String(room+1).padStart(2,'0')+' · '+r.title;$('sceneImg').alt=r.title+'의 코코와 나나';$('tools').replaceChildren();$('spots').replaceChildren();r.objects.forEach(([name,x,y],i)=>{const done=i%2===1&&solved[room][Math.floor(i/2)],b=button(name+(done?' ✓':''),()=>inspect(i));$('tools').append(b);const s=button('',()=>inspect(i));s.className='hotspot'+(done?' solved':'');s.style.left=x+'%';s.style.top=y+'%';s.setAttribute('aria-label',name);$('spots').append(s)});$('tokens').innerHTML=rooms.map((x,i)=>`<div class="token ${rewards[i]?'got':''}"><b>${x.icon}</b>${rewards[i]?x.token:'아직 여행 전'}</div>`).join('');$('count').textContent=rewards.filter(Boolean).length+' / '+rooms.length;}
function inspect(i){if(busy)return;const q=Math.floor(i/2);if(i%2===0){visited[room][q]=true;popup(rooms[room].objects[i][0],rooms[room].clues[q]);}else quiz(q);}
function quiz(q){const x=rooms[room].quizzes[q];if(solved[room][q])return popup(x.title,'<p>이미 해결한 퍼즐이야. 다른 단서도 살펴보자.</p>');let selected=[];popup(x.title,`<p>${x.question}</p>${x.type==='code'?'<input id="answer" class="code" aria-label="암호 입력" inputmode="numeric" autocomplete="off" maxlength="3"><p class="feedback" id="feedback" aria-live="polite"></p>':'<div id="selection" class="sequence">'+(x.type==='seq'?'순서대로 골라주세요':'알맞은 답을 골라주세요')+'</div><div id="choices" class="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p>'}`,[['단서 보기',()=>{visited[room][q]=true;popup(rooms[room].objects[q*2][0],rooms[room].clues[q],[['퍼즐로 돌아가기',()=>quiz(q),true]])}],['닫기',hide]]);const wrong=()=>{$('feedback').textContent='아직 맞지 않아. 단서를 다시 살펴볼까?';};if(x.type==='code'){const submit=button('암호 확인',()=>{if($('answer').value.trim()===x.answer)complete(q);else wrong()},true);$('popupActions').append(submit);$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')submit.click()});}else{x.options.forEach(opt=>$('choices').append(button(opt,()=>{if(x.type==='choice'){if(opt===x.answer)complete(q);else wrong();return}selected.push(opt);$('selection').textContent=selected.join(' → ');$('feedback').textContent='';if(selected.length===x.answer.length){if(selected.every((v,i)=>v===x.answer[i]))complete(q);else{wrong();selected=[];$('selection').textContent='순서를 다시 골라주세요';}}})));if(x.type==='seq')$('popupActions').append(button('선택 지우기',()=>{selected=[];$('selection').textContent='순서대로 골라주세요';$('feedback').textContent=''}));}}
async function complete(q){const run=epoch;if(solved[room][q])return;solved[room][q]=true;render();if(!solved[room].every(Boolean)){popup('첫 번째 퍼즐 해결!','<p>도장을 받을 준비가 반쯤 끝났어. 이 장소의 남은 퍼즐도 해결해보자.</p>',[['계속 탐색하기',hide,true]],true);return}busy=true;await preload(asset('success-'+(room+1)));if(run!==epoch)return;rewards[room]=true;busy=false;render();popup(rooms[room].success,`<img src="${asset('success-'+(room+1))}" alt="${rooms[room].success}"><p>${rooms[room].result}</p><div class="clue">${rooms[room].icon} <b>${rooms[room].token}</b> 획득</div>`,[[room===rooms.length-1?'이야기의 결말 보기':'다음 장소로 →',()=>{hide();if(room===rooms.length-1)ending();else go(room+1)},true]],true);}
async function go(next){const run=epoch;if(busy)return;busy=true;const imageReady=preload(asset('scene-'+(next+1)));$('fade').classList.add('cover');await new Promise(r=>setTimeout(r,250));await imageReady;if(run!==epoch)return;room=next;$('sceneImg').src=asset('scene-'+(room+1));$('sceneScroll').scrollLeft=0;render();requestAnimationFrame(()=>requestAnimationFrame(()=>{$('fade').classList.remove('cover');busy=false;}));}
async function ending(){const run=epoch;ended=true;await preload(asset('ending'));if(run!==epoch)return;popup('상하이에서 모은 다섯 가지 추억',`<img src="${asset('ending')}" alt="중국풍 드레스를 입고 상하이 야경 앞에서 인사하는 코코와 나나"><p class="ending-label">THE END · 코코나나 상하이 미션</p><p>쇼핑몰의 설렘, 예원의 초록빛, 난징동루의 노을, 함께 나눈 저녁, 와이탄의 야경.</p><p>다섯 도장을 모은 코코와 나나는 아름다운 중국풍 드레스로 갈아입고 여행의 마지막 사진을 남겼어.</p><div class="clue">코코 “하루 동안 이렇게 많은 추억이 생겼네!”<br>나나 “다음 여행에서도 같이 새로운 길을 찾아보자.”</div><p>코코와 나나의 상하이 여행에 함께해줘서 고마워!</p>`,[['결말 닫기',hide],['다시 플레이하기',reset,true]],true);}
function intro(){popup('코코나나 상하이 미션',`<img class="intro-art" src="${asset('scene-1')}" alt="쇼핑몰 거리의 코코와 나나"><p>코코와 나나의 상하이 여행이 시작됐어!<br>그런데 여행 도장북의 다섯 페이지가 텅 비어 있네?</p><p>쇼핑몰 거리 → 예원 → 난징동루 → 식당 → 와이탄.<br>여행지마다 숨은 단서를 찾아 도장을 모아보자.</p><div class="clue">그림 속 동그라미나 아래 탐색 버튼을 눌러봐.<br><b>각 장면의 퀴즈 2개를 모두 풀면 성공 일러스트와 다음 여행지가 열려.</b></div>`,[['여행 시작하기',hide,true]],true);}
function reset(){epoch++;hide();room=0;solved=rooms.map(()=>[false,false]);visited=rooms.map(()=>[false,false]);rewards.fill(false);busy=false;ended=false;$('fade').classList.remove('cover');$('sceneImg').src=asset('scene-1');$('sceneScroll').scrollLeft=0;render();intro();}
$('restart').onclick=()=>{if(busy)return;popup('처음부터 시작할까?','<p>지금까지 찾은 단서와 퍼즐 진행이 초기화돼.</p>',[['계속 플레이하기',hide],['처음부터',reset,true]])};$('note').onclick=()=>{let html='';rooms.forEach((r,i)=>{r.clues.forEach((c,q)=>{if(visited[i][q])html+=`<div class="note-row"><b>${r.title} · ${r.objects[q*2][0]}</b><div>${c}</div></div>`})});popup('단서 노트',html||'<p>아직 기록한 단서가 없어. 그림 속 물건을 살펴보자.</p>')};$('hint').onclick=()=>{if(ended)return ending();const q=solved[room].findIndex(v=>!v);popup('다음 한 걸음',q<0?'<p>이 장소의 퍼즐을 모두 해결했어.</p>':`<p><b>${rooms[room].quizzes[q].title}</b></p><p>${rooms[room].quizzes[q].hint}</p>`)};
window.addEventListener('resize',syncAppViewport);if(window.visualViewport)window.visualViewport.addEventListener('resize',syncAppViewport);window.addEventListener('pageshow',e=>{syncAppViewport();if(e.persisted)reset()});syncAppViewport();render();intro();
</script></body></html>
