{id:'valve',label:'산소 밸브',x:91,y:65,type:'sequence',title:'산소 밸브를 열자!',text:'작은 숫자부터 차례대로 눌러 주세요.',options:['8','2','5'],answer:['2','5','8'],result:'산소 순환이 시작됐어요!'}]},

{id:'signal',label:'신호 송신기',x:48,y:48,type:'choice',title:'지구에 신호를 보내자!',text:'수신 메모에 적힌 호출 신호를 골라요.',options:['짧게 → 길게 → 짧게','길게 → 짧게 → 짧게','짧게 → 짧게 → 길게'],answer:2,result:'지구와 통신이 연결됐어요!'}]},

function modal(title,body,closable=true){lastFocus=document.activeElement;$('#dialog').innerHTML=(closable?'<button class="close" aria-label="팝업 닫기">×</button>':'')+'<h2 id="dialogTitle">'+title+'</h2>'+body;$('#modal').classList.add('open');$('#modal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';if(closable)$('#dialog .close').onclick=closeModal;const dialogEl=$('#dialog');dialogEl.scrollTop=0;const focus=dialogEl.querySelector('input')||dialogEl.querySelector('.primary')||dialogEl.querySelector('button');if(focus){try{focus.focus({preventScroll:true});}catch(e){focus.focus();dialogEl.scrollTop=0;}requestAnimationFrame(()=>{dialogEl.scrollTop=0;});}}
function closeModal(){if(locked)return;$('#modal').classList.remove('open');$('#modal').setAttribute('aria-hidden','true');document.body.style.overflow='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').style.display='block';toastTimer=setTimeout(()=>$('#toast').style.display='none',2800);}
function intro(){modal('코코나나 우주정거장 대작전','<p class="intro-copy">지구로 돌아가려던 코코와 나나!<br>그런데 우주정거장의 시스템이 갑자기 멈췄어요.<br><br>장면 속 연한 표시를 눌러 단서를 찾거나, 아래 물건 버튼을 활용해 네 구역의 미션을 해결하고 귀환선을 출발시켜 주세요.</p><div class="clue">전력실 → 산소 정원 → 통신실 → 도킹실</div><p class="small">각 구역의 미션을 모두 해결하면 성공 팝업이 나와요. 팝업의 버튼을 눌러 다음 장소로 이동해요.</p><div class="actions"><button class="primary" id="begin">미션 시작</button></div>',false);$('#begin').onclick=closeModal;}
function openObject(o){if(solved.has(o.id)){modal(o.title,'<p>이미 해결한 미션이에요.</p><div class="clue">'+o.result+'</div><div class="actions"><button class="primary" id="ok">확인</button></div>');$('#ok').onclick=closeModal;return;}if(o.type==='clue'){modal(o.title,'<p>'+o.text+'</p><div class="clue">'+o.clue+'</div><div class="actions"><button class="primary" id="ok">기억했어!</button></div>');$('#ok').onclick=closeModal;return;}
let body='<p>'+o.text+'</p>';if(o.type==='code')body+='<form id="codeForm"><input class="code" id="answer" aria-label="'+o.length+'자리 비밀번호" inputmode="numeric" autocomplete="off" maxlength="'+o.length+'" placeholder="'+('·'.repeat(o.length))+'"><div class="feedback" id="feedback" role="status"></div><button class="primary" style="width:100%" type="submit">확인</button></form>';
if(o.type==='choice')body+='<div class="options">'+o.options.map((v,i)=>'<button class="option" data-choice="'+i+'">'+v+'</button>').join('')+'</div><div class="feedback" id="feedback" role="status"></div>';
if(o.type==='sequence')body+='<div class="sequence" id="sequenceDisplay"><span>?</span><span>?</span><span>?</span></div><div class="sequence">'+o.options.map((v,i)=>'<button data-sequence="'+i+'">'+v+'</button>').join('')+'</div><div class="feedback" id="feedback" role="status"></div><button class="secondary" id="clearSequence">다시 입력</button>';
modal(o.title,body);if(o.type==='code'){$('#answer').oninput=e=>e.target.value=e.target.value.replace(/[^0-9]/g,'');$('#codeForm').onsubmit=e=>{e.preventDefault();if($('#answer').value===o.answer)complete(o);else $('#feedback').textContent='아직 맞지 않아요. 단서를 다시 확인해 보세요.';};}if(o.type==='choice')$('#dialog').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>Number(b.dataset.choice)===o.answer?complete(o):$('#feedback').textContent='이 방법은 아닌 것 같아요. 단서를 확인해 보세요.');if(o.type==='sequence'){sequence=[];function show(){ $('#sequenceDisplay').innerHTML=[0,1,2].map(i=>'<span>'+(sequence[i]||'?')+'</span>').join(''); }$('#dialog').querySelectorAll('[data-sequence]').forEach(b=>b.onclick=()=>{if(sequence.length===3)sequence=[];sequence.push(o.options[Number(b.dataset.sequence)]);show();if(sequence.length===3){if(sequence.join('|')===o.answer.join('|'))complete(o);else $('#feedback').textContent='순서가 맞지 않아요. 다시 입력해 보세요.';}});$('#clearSequence').onclick=()=>{sequence=[];show();$('#feedback').textContent='';};}}
function complete(o){if(solved.has(o.id))return;solved.add(o.id);render();const all=stages[stage].objects.filter(x=>x.type!=='clue').every(x=>solved.has(x.id));if(all){stageSuccess();}else{modal('미션 성공!','<div class="clue">'+o.result+'</div><p>이 구역에 아직 해결할 미션이 남아 있어요.</p><div class="actions"><button class="primary" id="continue">계속 탐색하기</button></div>',false);$('#continue').onclick=closeModal;}}
function stageSuccess(){locked=true;const s=stages[stage];if(!cards.some(c=>c.name===s.reward))cards.push({name:s.reward,digit:s.digit});render();modal(s.name+' 복구 완료!','<img class="success-art" src="'+s.successImage+'" alt="'+s.name+' 미션을 마친 코코와 나나"><p>'+s.success+'</p><div class="clue">'+s.reward+' · 숫자 '+s.digit+'</div><div class="actions"><button class="primary" id="next">'+(stage<3?stages[stage+1].name+'으로 이동':'귀환선 문 열기')+'</button></div>',false);$('#next').onclick=()=>{locked=false;closeModal();if(stage<3){stage++;render();$('#sceneScroll').scrollLeft=0;}else finalDoor();};}
function finalDoor(){locked=true;modal('귀환 카드 인증 완료','<p>네 장의 카드를 귀환선에 연결했어요.\n마지막 문이 열리고 출발 준비가 끝났어요!</p><div class="clue">'+cards.map(c=>c.name+' · '+c.digit).join('\n')+'</div><div class="actions"><button class="primary" id="launch">지구로 출발</button></div>',false);$('#launch').onclick=ending;}
function ending(){modal('지구로, 무사히 귀환!','<img class="success-art" src="images/ending.webp" alt="코코와 나나가 지구를 향하며 미션 성공을 축하해요."><p>“나나, 저기 우리 집이 있는 지구야!”\n\n코코와 나나는 힘을 합쳐 모든 시스템을 복구했어요. 이제 따뜻한 집에서 맛있는 간식을 먹을 시간이에요.</p><div class="clue">미션 4 / 4 완료 · 우주 구조대 임무 성공</div><div class="actions"><button class="primary" id="again">다시 모험하기</button></div>',false);$('#progress').innerHTML='<span class="done"></span>'.repeat(4);$('#again').onclick=reset;}
function reset(){locked=false;stage=0;solved=new Set();cards=[];closeModal();render();$('#sceneScroll').scrollLeft=0;intro();}
$('#restart').onclick=()=>{modal('처음부터 다시 할까?','<p>해결한 미션과 수집한 카드가 초기화돼요.</p><div class="actions"><button class="secondary" id="cancel">계속하기</button><button class="primary" id="confirm">처음부터</button></div>');$('#cancel').onclick=closeModal;$('#confirm').onclick=reset;};
$('#hint').onclick=()=>modal('작은 힌트','<p>'+stages[stage].hint+'</p><div class="clue">'+stages[stage].objects.filter(o=>o.type!=='clue').map(o=>o.label+' · '+(solved.has(o.id)?'완료':'미해결')).join('\n')+'</div>');
$('#brief').onclick=()=>modal('미션 안내','<p>1. 장면 속 연한 원을 누르거나 아래 물건 버튼으로 단서를 확인해요.\n2. 이 구역의 미션 두 개를 해결해요.\n3. 성공 팝업의 이동 버튼으로 다음 구역에 가요.\n4. 네 장의 귀환 카드를 인증하고 지구로 출발해요.</p><p class="small">게임을 새로 열거나 새로고침하면 처음부터 시작해요.</p>');
$('#modal').onclick=e=>{if(e.target===$('#modal')&&$('#dialog .close'))closeModal();};document.addEventListener('keydown',e=>{if(!$('#modal').classList.contains('open'))return;if(e.key==='Escape'&&$('#dialog .close'))closeModal();if(e.key==='Tab'){const list=[...$('#dialog').querySelectorAll('button,input,a')].filter(x=>!x.disabled);if(!list.length)return;const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});window.addEventListener('pageshow',e=>{if(e.persisted)reset();});render();intro();
</script>
</body>
</html>
